# 公开镜像 Tinghecui/dodoer-releases：可行性验证（spike），文件在私有仓库 cowork-codeg 的 .github/public/workflows/ 里维护。
# 问题：在 GitHub 托管的 macos-15 上，能不能像 Linux 那条（desktop-linux.yml + tauri-driver）一样，用 WebDriver 读写桌面 app 的
# WKWebView DOM？做法：debug 版带 cargo feature `e2e` 编，进程里内嵌 WebDriver 服务器（tauri-plugin-wdio-webdriver），
# WebdriverIO + @wdio/tauri-service 连上去跑 scripts/desktop-e2e/ 的 spec；同一份 spec 在 ubuntu 上走官方 tauri-driver，看一份能不能两边用。
# 来历和结论：源仓库 .cowork/journal/2026-11-21-spike-macos-webdriver.md。
#
# 只手动触发：gh workflow run desktop-e2e-spike.yml -R Tinghecui/dodoer-releases --ref pr/<n>（或 main）。
# 不挂在 pr/** 推送上：合进 product 以后每个 PR 的 pr/<n> 都带着这个文件，每次推送都会在 macOS 上冷编半小时。
# 不报回私有仓库，到公开仓库的 Actions 看。重跑（量稳定性）：gh run rerun <run> -R Tinghecui/dodoer-releases。
# 编好的程序按源码哈希缓存，命中就不编。正式的桌面 e2e（PR check、每晚、台账）是 P2，还没定。
name: desktop-e2e-spike

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: short
  # 同 desktop-linux.yml / test.yml：调试信息只留行号表、并行 2、不要增量
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: ${{ matrix.os }}：编 debug 桌面版 + WebdriverIO
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            features: e2e
          - os: ubuntu-22.04
            features: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 机器
        run: |
          uname -a
          if [[ "$RUNNER_OS" == macOS ]]; then sw_vers; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; system_profiler SPDisplaysDataType | grep -E 'Resolution|Display Type' || true
          else nproc; free -h; fi
          df -h / | tail -1

      - name: 系统包（Linux：WebKitGTK、WebKitWebDriver、xvfb）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb dbus-x11

      # restore / save 分开：后面 WebdriverIO 那步红了也要把编好的程序存下来，重跑才不用重编
      - name: 编好的程序（缓存）
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: |
            src-tauri/target/debug/codeg
            src-tauri/target/debug/codeg-server
            src-tauri/target/debug/codeg-mcp
            src-tauri/target/debug/codeg-cli
            src-tauri/target/debug/codeg-computer-helper
            src-tauri/target/debug/web
            src-tauri/Cargo.lock
          key: desktop-e2e-spike-bin-v1-${{ runner.os }}-${{ hashFiles('src-tauri/**', 'src/**', 'public/**', 'package.json', 'pnpm-lock.yaml', 'rust-toolchain.toml', '*.config.*') }}

      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.bin.outputs.cache-hit != 'true' || runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Rust cache
        if: steps.bin.outputs.cache-hit != 'true' || runner.os == 'Linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-e2e-spike
          cache-on-failure: true

      - name: tauri-driver（Linux）
        if: runner.os == 'Linux'
        run: command -v tauri-driver || cargo install tauri-driver --locked

      - name: 腾磁盘（Linux）
        if: runner.os == 'Linux' && steps.bin.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: pnpm/action-setup@v4
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm install
        if: steps.bin.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: 前端（静态导出）
        if: steps.bin.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          t0=$(date +%s)
          pnpm build
          echo "- ${{ matrix.os }} 前端 pnpm build：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: sidecar（codeg-server 等，debug）
        if: steps.bin.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo build --bin codeg-mcp --bin codeg-computer-helper --bin codeg-cli --bin codeg-server \
            --no-default-features --features mcp-bin,computer-helper,cli-bin,server-bin
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries
          for b in codeg-mcp codeg-computer-helper codeg-cli codeg-server; do
            cp "target/debug/$b" "binaries/$b-$triple"
          done
          echo "- ${{ matrix.os }} sidecar：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 桌面主程序（tauri build --debug --no-bundle${{ matrix.features && ' --features e2e' || '' }}）
        if: steps.bin.outputs.cache-hit != 'true'
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          t0=$(date +%s)
          extra=()
          if [[ -n "$FEATURES" ]]; then extra=(--features "$FEATURES"); fi
          pnpm tauri build --debug --no-bundle "${extra[@]}" \
            --config src-tauri/tauri.jenny.conf.json --config src-tauri/tauri.cowork-desktop.conf.json \
            --config '{"version":"1.999.0","build":{"beforeBuildCommand":""}}'
          test -x src-tauri/target/debug/codeg
          ls -la src-tauri/target/debug/codeg
          echo "- ${{ matrix.os }} 桌面主程序：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 存编好的程序
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/target/debug/codeg
            src-tauri/target/debug/codeg-server
            src-tauri/target/debug/codeg-mcp
            src-tauri/target/debug/codeg-cli
            src-tauri/target/debug/codeg-computer-helper
            src-tauri/target/debug/web
            src-tauri/Cargo.lock
          key: ${{ steps.bin.outputs.cache-primary-key }}

      # Cargo.lock 是 CI 按新依赖解出来的（本机不跑 cargo），传上去给源仓库提交用
      - name: Cargo.lock 的改动
        run: |
          git diff --stat -- src-tauri/Cargo.lock || true
          git diff -- src-tauri/Cargo.lock > cargo-lock.diff || true
          mkdir -p e2e-out && cp src-tauri/Cargo.lock e2e-out/Cargo.lock

      - name: 二进制里有没有 WebDriver 插件
        run: |
          n=$(strings -a src-tauri/target/debug/codeg | grep -c 'WDIO WebDriver plugin initialized' || true)
          echo "- ${{ matrix.os }}：codeg 里 WebDriver 插件的字符串出现 ${n} 次（feature=${{ matrix.features || '无' }}）" >> "$GITHUB_STEP_SUMMARY"

      - name: WebdriverIO 依赖（npm，不进 pnpm 项目）
        working-directory: scripts/desktop-e2e
        run: |
          set -euo pipefail
          t0=$(date +%s)
          npm install --no-package-lock --no-audit --no-fund
          echo "- ${{ matrix.os }} npm install（wdio）：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: WebdriverIO：第一次启动 → 退出 → 第二次启动
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: |
          set -uo pipefail
          export E2E_DATA_DIR=$(mktemp -d)
          run_phase() {
            local t0=$(date +%s) rc=0
            if [[ "$RUNNER_OS" == Linux ]]; then
              E2E_PHASE=$1 xvfb-run -a --server-args="-screen 0 1440x900x24" dbus-run-session -- \
                scripts/desktop-e2e/node_modules/.bin/wdio run scripts/desktop-e2e/wdio.conf.mjs || rc=$?
            else
              E2E_PHASE=$1 scripts/desktop-e2e/node_modules/.bin/wdio run scripts/desktop-e2e/wdio.conf.mjs || rc=$?
            fi
            echo "- ${{ matrix.os }} 第 ${1} 次启动：rc=${rc}，$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"
            return $rc
          }
          rc=0
          run_phase 1 || rc=1
          sleep 2
          left=$(pgrep -x codeg || true)
          echo "第一次跑完还在的 codeg 进程：${left:-无}"
          echo "- ${{ matrix.os }} 第一次跑完还在的 codeg 进程：${left:-无}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$left" ]]; then kill -9 $left || true; fi
          run_phase 2 || rc=1
          for f in e2e-out/result-phase*.json; do
            [[ -f "$f" ]] && node -e 'const r=require(process.argv[1]);for(const s of r.steps)console.log(`- ${r.platform} phase${r.phase} ${s.ok?"过":"没过"} ${s.name}（${s.seconds}s）`)' "$PWD/$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit $rc

      - name: app 日志
        if: always()
        run: |
          mkdir -p e2e-out/app-logs
          find "${TMPDIR:-/tmp}" /tmp -maxdepth 3 -name '*.log' -newer package.json 2>/dev/null | head -50 | while read -r f; do cp "$f" e2e-out/app-logs/ 2>/dev/null || true; done
          if [[ "$RUNNER_OS" == macOS ]]; then ls ~/Library/WebKit ~/Library/Logs 2>/dev/null | head -40 || true; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-spike-${{ matrix.os }}-attempt${{ github.run_attempt }}
          path: |
            e2e-out
            cargo-lock.diff
          if-no-files-found: warn
          retention-days: 14
