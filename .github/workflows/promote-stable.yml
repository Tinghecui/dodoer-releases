# 公开镜像 Tinghecui/dodoer-releases 的稳定版晋级（文件在私有仓库 cowork-codeg 的 .github/public/workflows/ 里维护；cowork-codeg #410）。
# 每小时看一次：抢先版（release-train 每班发的、Latest）里发布满 24 小时、Sentry 里没有崩溃和升级失败的，指成稳定版
# （tag stable 的 Release，预发布）。两次晋级至少隔 24 小时。规则和稳定版里的文件见 scripts/promote-stable.sh。
#
# - 撤回 / 跳过闸门：手动跑，填 version（比如 1.6.48），稳定版直接指过去，比现在的旧也行
# - 暂停自动晋级：仓库变量 STABLE_HOLD 设成 true（手动指定不受影响）
# - 闸门要读 Sentry：secret SENTRY_READ_TOKEN（只读的个人令牌：event:read、org:read、project:read）、变量 SENTRY_ORG。
#   没配就不自动晋级，只能手动指定
name: promote-stable

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "直接把稳定版指到这一版桌面包（如 1.6.48），不看闸门；空着就按闸门挑"
        required: false
        default: ""

permissions:
  contents: write # 建、改 stable 这个 Release

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    name: 晋级稳定版
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 挑版本、过闸门、指过去
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          HOLD: ${{ vars.STABLE_HOLD }}
          SENTRY_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: bash scripts/promote-stable.sh
