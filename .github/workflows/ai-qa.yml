# 公开镜像 Tinghecui/dodoer-releases：跑源仓库的 QA（文件在源仓库 .github/public/workflows/ 里维护）。
# 这里只是个壳：把源仓库克隆下来、执行里面的脚本。脚本的输出全部进文件、结果传回源仓库，
# 这份日志里只有每个阶段一行的进度；运行结束后 ai-qa-seal.yml 会核对这一点。
# 凭证在 Environment「ai-qa」里，只有 main 分支用得到。
name: ai-qa
# 会开 issue 的轮次叫「ai-qa」，PR 验收、只搭环境的另起名字（源仓库 run.sh 的 s_wait_others 按名字找还在跑的轮次）
# 整个值要加引号：里面的「 #」不加引号会被 YAML 当成注释截掉，整个文件失效（2026-11-13 #186 就这样，每晚那轮差点起不来）
run-name: "${{ inputs.pr && format('ai-qa PR #{0}', inputs.pr) || inputs.setup_only && 'ai-qa 只搭环境' || 'ai-qa' }}"

on:
  # 每晚那轮的兜底：准点的那次由生产机的 crontab 在 18:23 UTC 手动触发（-f nightly=true）；GitHub 的定时常晚几个小时，
  # 晚到时那个提交已经测过（台账里有、或 Release 附件里有 tested-<版本>.txt）就跳过（run.sh 的 s_gate）
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "按每晚那次跑（定时任务用）：真 agent、测分支最新提交、验收还没验收过的 PR、同一个提交测过就跳过"
        type: boolean
        default: false
      ref:
        description: "源仓库的分支（空 = 默认分支）"
        default: ""
      pr:
        description: "源仓库的 PR 号（填了就验收这个 PR）"
        default: ""
      stories:
        description: "故事编号，逗号分隔（空 = 默认）"
        default: ""
      explore:
        description: "探索区域（空 = 默认）"
        default: ""
      version:
        description: "版本 tag（空 = 最新 Release，或者见 head）"
        default: ""
      head:
        description: "测分支的最新提交（和每晚一样现编；停在 tag 上就测 Release）；不勾 = 测最新 Release"
        type: boolean
        default: false
      changes:
        description: "改动验收：PR 号逗号分隔，或 new、untested"
        default: ""
      real_agent:
        type: boolean
        default: false
      # 预发（源仓库 .cowork/ai-qa/design.md「预发环境」）：每晚那轮默认就用；手动的勾了才用。用不用还要看 secret AIQA_STAGING 的自检结果
      staging:
        description: "也在预发上走要 agent 回话的 P0 故事和升级留存（每晚那轮默认用）"
        type: boolean
        default: false
      # 三个模型空着时用这个仓库的变量 AIQA_AGENT_MODEL、AIQA_MODEL、AIQA_PM_MODEL，再没有用下面 env 里写的默认
      agent_model:
        default: ""
      max_turns:
        default: "2000"
      model:
        default: ""
      pm_model:
        default: ""
      # AI QA 自己的几个角色的凭证：空 = 这个仓库的变量 AIQA_CLAUDE_AUTH，没有就 oauth（订阅令牌）；api = API key（实际扣费）
      claude_auth:
        default: ""
      # verify = 不在这台机器上搭环境，测验收机上装着的版本（源仓库 .cowork/ai-qa/design.md「验收机」）；要 secret AIQA_VERIFY、AIQA_VERIFY_ACCOUNTS
      env:
        type: choice
        options: [cowork, bare, verify]
        default: cowork
      setup_only:
        type: boolean
        default: false
      # 重派出来的（日志核对 ai-qa-seal 看到上一次死在机器上，源仓库 .cowork/ai-qa/redispatch.mjs）填 1：再死也不再派
      retry:
        description: "重派标记（自动填，人手动跑不用管）"
        default: ""

permissions:
  contents: read
  actions: read

# 验收机的轮次单独一组：它不在这台机器上搭环境，和现搭环境的轮次不抢东西；会开 issue 的轮次之间照旧由 run.sh 的 s_wait_others 排先后
concurrency:
  group: ai-qa-${{ inputs.pr && format('pr-{0}', inputs.pr) || (inputs.setup_only && 'setup' || (inputs.env == 'verify' && 'verify' || 'run')) }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-24.04
    environment: ai-qa
    timeout-minutes: 340
    env:
      SOURCE_REPO: Tinghecui/cowork-codeg
      PUBLIC_REPO: ${{ github.repository }}
      W: /home/runner/ai-qa-work
      EVENT: ${{ github.event_name }}
      REF: ${{ inputs.ref }}
      PR: ${{ inputs.pr }}
      NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'true' || 'false' }}
      REAL_AGENT: ${{ (github.event_name == 'schedule' || inputs.nightly || inputs.real_agent) && 'true' || 'false' }}
      AIQA_ENV: ${{ inputs.env || 'cowork' }}
      SETUP_ONLY: ${{ inputs.setup_only && 'true' || 'false' }}
      HEAD_BUILD: ${{ inputs.head && 'true' || 'false' }}
      CHANGES: ${{ inputs.changes }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_STORIES: ${{ inputs.stories }}
      INPUT_EXPLORE: ${{ inputs.explore }}
      MAX_TURNS: ${{ inputs.max_turns || '2000' }}
      MODEL: ${{ inputs.model || vars.AIQA_MODEL || 'claude-opus-5-5' }}
      PM_MODEL: ${{ inputs.pm_model || vars.AIQA_PM_MODEL || vars.AIQA_MODEL || 'claude-opus-5-5' }}
      AGENT_MODEL: ${{ inputs.agent_model || vars.AIQA_AGENT_MODEL || 'claude-haiku-5-5' }}
      CLAUDE_AUTH: ${{ inputs.claude_auth || vars.AIQA_CLAUDE_AUTH || 'oauth' }}
      ROTATE: ${{ vars.AIQA_ROTATE || '8' }}
      SEGMENTS: ${{ vars.AIQA_SEGMENTS || '3' }}
      TRIAGE: ${{ vars.AIQA_TRIAGE || '12' }}
      AIQA_ADAPTER_VERSION: ${{ vars.AIQA_ADAPTER_VERSION }}
      STAGING: ${{ (github.event_name == 'schedule' || inputs.nightly || inputs.staging) && 'true' || 'false' }}
      STAGING_AGENT: ${{ vars.AIQA_STAGING_AGENT || 'p0' }}
      AIQA_RETRY: ${{ inputs.retry }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: run
        env:
          AIQA_PRIVATE_TOKEN: ${{ secrets.AIQA_PRIVATE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEG_AGENT_ANTHROPIC_KEY: ${{ secrets.CODEG_AGENT_ANTHROPIC_KEY }}
          AIQA_ANTHROPIC_API_KEY: ${{ secrets.AIQA_ANTHROPIC_API_KEY }}
          COWORK_RELEASE_TOKEN: ${{ secrets.COWORK_RELEASE_TOKEN }}
          PUBLIC_SYNC_DEPLOY_KEY: ${{ secrets.PUBLIC_SYNC_DEPLOY_KEY }}
          # 预发的自检结果（生产机的 aiqa-staging check 写）。放 secret 不放变量：变量的值会原样打进公开的运行日志
          AIQA_STAGING: ${{ secrets.AIQA_STAGING }}
          AIQA_STAGING_ACCOUNTS: ${{ secrets.AIQA_STAGING_ACCOUNTS }}
          # 验收机的自检结果和账户（生产机的 AIQA_STAGING_CONF=~/.config/aiqa-verify aiqa-staging check / seed 写）
          AIQA_VERIFY: ${{ secrets.AIQA_VERIFY }}
          AIQA_VERIFY_ACCOUNTS: ${{ secrets.AIQA_VERIFY_ACCOUNTS }}
        run: |
          set -euo pipefail
          src="${PR:+refs/pull/$PR/merge}"; src="${src:-${REF:-HEAD}}"
          url="https://x-access-token:${AIQA_PRIVATE_TOKEN}@github.com/${SOURCE_REPO}.git"
          git init -q .
          if ! git fetch -q --depth 1 "$url" "$src" 2>/dev/null; then
            # PR 在派这一轮之后、机器起来之前合进去了（调度台的界面试跑在审查员通过时派，auto-merge 几秒后就合，2026-11-18 的 PR #632）：
            # refs/pull/<n>/merge 合并以后就没了，改测合进去的那个提交（和合并前的 refs/pull/<n>/merge 一样，第一个父是 base、第二个是 PR 头）
            mc=""
            if [[ -n "$PR" ]]; then
              mc=$(GH_TOKEN="$AIQA_PRIVATE_TOKEN" gh api "repos/$SOURCE_REPO/pulls/$PR" --jq 'select(.merged) | .merge_commit_sha' 2>/dev/null || true)
            fi
            { [[ -n "$mc" ]] && git fetch -q --depth 1 "$url" "$mc" 2>/dev/null; } || { echo "fetch failed"; exit 1; }
          fi
          git checkout -q --detach FETCH_HEAD
          exec bash .cowork/ai-qa/sealed.sh
