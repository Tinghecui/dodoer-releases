# 公开镜像 Tinghecui/dodoer-releases：跑源仓库的 QA（文件在源仓库 .github/public/workflows/ 里维护）。
# 这里只是个壳：把源仓库克隆下来、执行里面的脚本。脚本的输出全部进文件、结果传回源仓库，
# 这份日志里只有每个阶段一行的进度；运行结束后 ai-qa-seal.yml 会核对这一点。
# 凭证在 Environment「ai-qa」里，只有 main 分支用得到。
name: ai-qa
# 会开 issue 的轮次叫「ai-qa」，PR 验收、只搭环境的另起名字（源仓库 run.sh 的 s_wait_others 按名字找还在跑的轮次）
# 整个值要加引号：里面的「 #」不加引号会被 YAML 当成注释截掉，整个文件失效（2026-11-13 #186 就这样，每晚那轮差点起不来）
run-name: "${{ inputs.pr && format('ai-qa PR #{0}', inputs.pr) || inputs.setup_only && 'ai-qa 只搭环境' || 'ai-qa' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "源仓库的分支（空 = 默认分支）"
        default: ""
      pr:
        description: "源仓库的 PR 号（填了就验收这个 PR）"
        default: ""
      stories:
        description: "故事编号，逗号分隔（空 = 默认）"
        default: ""
      explore:
        description: "探索区域（空 = 默认）"
        default: ""
      version:
        description: "版本 tag（空 = 最新 Release，或者见 head）"
        default: ""
      head:
        description: "测分支的最新提交（和每晚一样现编；停在 tag 上就测 Release）；不勾 = 测最新 Release"
        type: boolean
        default: false
      changes:
        description: "改动验收：PR 号逗号分隔，或 new、untested"
        default: ""
      real_agent:
        type: boolean
        default: false
      # 三个模型空着时用这个仓库的变量 AIQA_AGENT_MODEL、AIQA_MODEL、AIQA_PM_MODEL，再没有用下面 env 里写的默认
      agent_model:
        default: ""
      max_turns:
        default: "2000"
      model:
        default: ""
      pm_model:
        default: ""
      # AI QA 自己的几个角色的凭证：空 = 这个仓库的变量 AIQA_CLAUDE_AUTH，没有就 oauth（订阅令牌）；api = API key（实际扣费）
      claude_auth:
        default: ""
      env:
        type: choice
        options: [cowork, bare]
        default: cowork
      setup_only:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-qa-${{ inputs.pr && format('pr-{0}', inputs.pr) || (inputs.setup_only && 'setup' || 'run') }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-24.04
    environment: ai-qa
    timeout-minutes: 340
    env:
      SOURCE_REPO: Tinghecui/cowork-codeg
      PUBLIC_REPO: ${{ github.repository }}
      W: /home/runner/ai-qa-work
      EVENT: ${{ github.event_name }}
      REF: ${{ inputs.ref }}
      PR: ${{ inputs.pr }}
      NIGHTLY: "false"
      REAL_AGENT: ${{ inputs.real_agent && 'true' || 'false' }}
      AIQA_ENV: ${{ inputs.env || 'cowork' }}
      SETUP_ONLY: ${{ inputs.setup_only && 'true' || 'false' }}
      HEAD_BUILD: ${{ inputs.head && 'true' || 'false' }}
      CHANGES: ${{ inputs.changes }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_STORIES: ${{ inputs.stories }}
      INPUT_EXPLORE: ${{ inputs.explore }}
      MAX_TURNS: ${{ inputs.max_turns || '2000' }}
      MODEL: ${{ inputs.model || vars.AIQA_MODEL || 'claude-opus-5-5' }}
      PM_MODEL: ${{ inputs.pm_model || vars.AIQA_PM_MODEL || vars.AIQA_MODEL || 'claude-opus-5-5' }}
      AGENT_MODEL: ${{ inputs.agent_model || vars.AIQA_AGENT_MODEL || 'claude-haiku-4-5' }}
      CLAUDE_AUTH: ${{ inputs.claude_auth || vars.AIQA_CLAUDE_AUTH || 'oauth' }}
      ROTATE: ${{ vars.AIQA_ROTATE || '8' }}
      TRIAGE: ${{ vars.AIQA_TRIAGE || '12' }}
      AIQA_ADAPTER_VERSION: ${{ vars.AIQA_ADAPTER_VERSION }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: run
        env:
          AIQA_PRIVATE_TOKEN: ${{ secrets.AIQA_PRIVATE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEG_AGENT_ANTHROPIC_KEY: ${{ secrets.CODEG_AGENT_ANTHROPIC_KEY }}
          AIQA_ANTHROPIC_API_KEY: ${{ secrets.AIQA_ANTHROPIC_API_KEY }}
          COWORK_RELEASE_TOKEN: ${{ secrets.COWORK_RELEASE_TOKEN }}
          PUBLIC_SYNC_DEPLOY_KEY: ${{ secrets.PUBLIC_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          src="${PR:+refs/pull/$PR/merge}"; src="${src:-${REF:-HEAD}}"
          git init -q .
          git fetch -q --depth 1 "https://x-access-token:${AIQA_PRIVATE_TOKEN}@github.com/${SOURCE_REPO}.git" "$src" 2>/dev/null \
            || { echo "fetch failed"; exit 1; }
          git checkout -q --detach FETCH_HEAD
          exec bash .cowork/ai-qa/sealed.sh
