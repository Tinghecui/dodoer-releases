# 黑苹果自托管 runner（标签 hackintosh）的心跳：每 10 分钟在它上面跑一次小任务。desktop-macos.yml 看最近一次成功的时间
# 判断它在不在线（45 分钟内算在线），不在线就全在 GitHub 托管机器上编。
# 黑苹果离线时这里的 run 会排着；同一组新排的会把旧的顶掉，最多积一个。GitHub 的定时任务常被压着（几个小时才跑一次），
# 所以另有机器每 10 分钟用 workflow_dispatch 派一次，下面的 schedule 只是备用；3 个 runner 都忙时心跳也要排队，阈值放宽到 45 分钟。
#
# 顺便给状态页（hackintosh-status-pages.yml，2026-11-16 起）记数：queue 在 GitHub 机器上记这一刻 3 个 runner 各在跑什么、
# 几个活在排队（不等 beat：runner 都忙时 beat 排着，这份快照照样能说明机器在线），记在本仓库的 hackintosh-status 分支
# （scripts/hackintosh-status-record.sh）；记失败不算心跳失败（continue-on-error），在线判断只看 beat。
# 负载、内存、磁盘不在这里采：runner 都忙时 beat 排着，最该看负载的时候反而没数。改由派心跳的那台机器每 10 分钟 ssh 过去采
# （scripts/hackintosh-status-host.sh）
name: hackintosh-heartbeat

on:
  schedule:
    # 不放整点（整点的定时任务最挤）
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: hackintosh-heartbeat
  cancel-in-progress: true

jobs:
  beat:
    name: 心跳
    runs-on: [self-hosted, hackintosh]
    timeout-minutes: 5
    steps:
      - run: |
          echo "黑苹果在线：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          df -h / | tail -1

  queue:
    name: 记 runner 和排队
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/hackintosh-status-record.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 这一刻在跑、在排队的 run 里，要 hackintosh 标签的 job（不算这次心跳自己）
          jobs=$(for s in in_progress queued; do
                   gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
                     -q '.workflow_runs[] | "\(.id)\t\(.name)"'
                 done | sort -u | while IFS=$'\t' read -r id wf; do
                   [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
                   gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                     | jq -c --arg wf "$wf" --argjson run "$id" '.jobs[] | select(.labels | index("hackintosh"))
                         | select(.status != "completed")
                         | {wf: $wf, run: $run, job: .name, status: .status, runner: .runner_name, started: .started_at}'
                 done | jq -cs .)
          # 整班在等前一班的 run（concurrency 排着，status=pending）：还没建 job，上面数不到。release-train 一次只发一班、
          # 排着的只留最新一个，编的时候合进来的几个 PR 都攒在这一班里
          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=pending&per_page=50" \
            -q '[.workflow_runs[] | select(.path | test("/(desktop-macos|desktop-macos-intel|release-train)\\.yml$"))
                 | {wf: .name, run: .id, job: "整班在等前一班跑完", status: "pending", title: (.display_title | .[0:80])}]')
          line=$(jq -cn --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson jobs "$jobs" --argjson pending "$pending" \
            '{t: $t, running: [$jobs[] | select(.status == "in_progress")],
              queued: ([$jobs[] | select(.status != "in_progress")] + $pending)}')
          echo "$line"
          bash scripts/hackintosh-status-record.sh queue "$line"
