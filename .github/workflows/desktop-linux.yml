# 公开镜像 Tinghecui/dodoer-releases：Linux 桌面版的 WebDriver 冒烟（文件在私有仓库 cowork-codeg 的 .github/public/workflows/ 里维护）。
# 可行性验证（2026-11-18，源仓库 .cowork/journal/2026-11-18-linux-desktop-webdriver-spike.md）：我们只发 macOS 桌面版，AI QA 测不到
# 「只有桌面 app 才有」的行为。这里在 GitHub 托管的 Linux 机器上编出桌面程序（不打包、不发），用 Tauri 官方的 WebDriver
# （tauri-driver + WebKitWebDriver，xvfb 里）把它开起来，跑 scripts/desktop-linux-smoke.mjs。
#
# 只按需跑，不是必需检查，结果也不报回私有 PR（report-status.yml 没列它），到这个仓库的 Actions 里看：
# - 私有 PR 打了 linux-desktop 标签：public-sync 把它同步到 linux/pr/<n>，这里编、冒烟。PR 再推会重跑，去掉标签或关掉 PR 就删分支
# - 手动触发（Actions → desktop-linux → Run workflow）：编任意分支
#
# 编法：前端（pnpm build）→ sidecar（debug，不带桌面 feature）→ 桌面主程序（tauri build --debug --no-bundle）。主 crate 要编两遍
# （sidecar 一遍、桌面一遍），所以把编出来的几个程序按源码的哈希存进缓存：只改冒烟脚本、workflow 时不重编，几分钟一轮。
name: desktop-linux

on:
  push:
    branches: ["linux/pr/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "要编的分支 / tag / 提交"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: short
  # 同 test.yml：调试信息只留行号表
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # 同 test.yml 的 Rust job：托管机器 4 核 16G，主 crate 一个 rustc 高峰 7～9G，并行多了会被杀；增量编译在新机器上用不上
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  smoke:
    name: 编 Linux 桌面版 + WebDriver 冒烟
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # 分支推送按提交 sha 取：linux/pr/<n> 在 PR 合并、关闭时就删了
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}

      - name: 系统包（WebKitGTK、WebKitWebDriver、xvfb）
        run: |
          set -euo pipefail
          t0=$(date +%s)
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            dbus-x11 \
            imagemagick
          command -v WebKitWebDriver
          dpkg -s libwebkit2gtk-4.1-0 | grep '^Version'
          echo "- 系统包：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      # 编出来的程序按源码哈希缓存：命中就不装 Rust、不编
      - name: 编好的程序（缓存）
        id: bin
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/debug/codeg
            src-tauri/target/debug/codeg-server
            src-tauri/target/debug/codeg-mcp
            src-tauri/target/debug/codeg-cli
            src-tauri/target/debug/codeg-computer-helper
            src-tauri/target/debug/web
          key: desktop-linux-bin-v1-${{ hashFiles('src-tauri/**', 'src/**', 'public/**', 'package.json', 'pnpm-lock.yaml', 'rust-toolchain.toml', '*.config.*') }}

      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Rust cache
        # 只缓存依赖（同 test.yml）；tauri-driver 装在 ~/.cargo/bin，也跟着缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-linux-webdriver
          cache-on-failure: true

      - name: tauri-driver
        run: |
          set -euo pipefail
          t0=$(date +%s)
          command -v tauri-driver || cargo install tauri-driver --locked
          echo "- tauri-driver：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 腾磁盘
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1; free -h | sed -n '2p'

      - uses: pnpm/action-setup@v4
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm install
        if: steps.bin.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: 前端（静态导出）
        if: steps.bin.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          t0=$(date +%s)
          pnpm build
          echo "- 前端 pnpm build：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      # 同 prepare-sidecars.mjs，只是编 debug（和桌面主程序共用一份依赖），一次 cargo 编四个
      - name: sidecar（codeg-server 等，debug）
        if: steps.bin.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo build --bin codeg-mcp --bin codeg-computer-helper --bin codeg-cli --bin codeg-server \
            --no-default-features --features mcp-bin,computer-helper,cli-bin,server-bin
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries
          for b in codeg-mcp codeg-computer-helper codeg-cli codeg-server; do
            cp "target/debug/$b" "binaries/$b-$triple"
          done
          ls -la binaries
          echo "- sidecar（主 crate 第一遍）：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 桌面主程序（tauri build --debug --no-bundle）
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          t0=$(date +%s)
          # 前端和 sidecar 上面编过了，beforeBuildCommand 置空；配置叠法同 scripts/cowork-desktop-build.sh
          pnpm tauri build --debug --no-bundle \
            --config src-tauri/tauri.jenny.conf.json --config src-tauri/tauri.cowork-desktop.conf.json \
            --config '{"build":{"beforeBuildCommand":""}}'
          ls -la src-tauri/target/debug | head -60
          test -x src-tauri/target/debug/codeg
          test -s src-tauri/target/debug/codeg-server
          echo "- 桌面主程序（主 crate 第二遍）：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 程序自报（--desktop-edition）
        run: |
          ls -la src-tauri/target/debug/codeg src-tauri/target/debug/codeg-server
          src-tauri/target/debug/codeg --desktop-edition

      - name: WebDriver 冒烟
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke-out
        run: |
          set -euo pipefail
          t0=$(date +%s)
          rc=0
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            dbus-run-session -- node scripts/desktop-linux-smoke.mjs || rc=$?
          echo "- 冒烟：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux-smoke
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14
