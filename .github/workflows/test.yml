# 公开镜像 Tinghecui/dodoer-releases 的测试（这个文件在私有仓库 cowork-codeg 的 .github/public/workflows/ 里维护，
# 同步时挪到 .github/workflows/；规则见那边的 COWORK.md「公开镜像」）。
# 只跑 GitHub 托管的机器（公开仓库不收费，Linux 4 核 16G）。分支：main 对应私有的 product 分支，pr/<n> 对应私有的 PR #n。
name: Test

on:
  push:
    branches:
      - main
      - "pr/**"

env:
  RUST_BACKTRACE: short
  # Refuse to silently regenerate snapshots in CI — any drift must be
  # accepted locally with `cargo insta review` and committed.
  INSTA_UPDATE: "no"
  # Debuginfo as line tables only (`test` inherits `dev`): backtraces keep
  # their file:line, and the type and variable records no CI step reads are
  # not built.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# pr/<n> 上新推送取消旧的那次；main 上不取消：main 只测「比上一次推送改了什么」，连着合并时前一次被取消，
# 它那部分改动就再也没人测（2026-11-13 连合 4 个改 Rust 的 PR，全被取消，最后一次只改了前端，Rust 一次没跑）
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 按改动范围决定跑哪些 job。pr/<n> 分支和 main 比（merge-base），main 上和「上一次 Test 通过的提交」比；工作流文件自己改了就全跑
  changes:
    name: Changed areas
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      install: ${{ steps.filter.outputs.install }}
      editions: ${{ steps.filter.outputs.editions }}
      workflows: ${{ steps.filter.outputs.workflows }}
      # main 上和哪个提交比（PR 上是空的）；Rust fmt 只查这之后改了的行
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          # main 要和更早的提交比，得有历史
          fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
      # main 上不和「上一次推送」比，和上一次 Test 通过的那个提交比：连着合并时，concurrency 只留一个排队的，
      # 更新的推送会把还在排队的那次顶掉（cancel-in-progress: false 也一样），只和上一次推送比的话，被顶掉那次的改动就没人测了
      # （2026-11-13 #191 的前端改动就这样漏掉：它那次在排队时被 #188 顶掉，#188 只改了 Rust）。找不到或不是祖先就退回上一次推送
      - id: base
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          green=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?branch=main&event=push&status=success&per_page=1" -q '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -n "$green" ] && git merge-base --is-ancestor "$green" HEAD 2>/dev/null; then base=$green; else base=$BEFORE; fi
          echo "和 $base 比（上一次通过的：${green:-没找到}，上一次推送：$BEFORE）"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.base || 'main' }}
          filters: |
            workflows:
              - ".github/workflows/**"
              - "scripts/ci/**"
            frontend:
              - "src/**"
              - "browser-agent/**"
              - "public/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "*.config.*"
              - "tsconfig.json"
              - "components.json"
              - ".github/workflows/test.yml"
              - "scripts/ci/rerun-failed.mjs"
            rust:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/test.yml"
              - "scripts/ci/rerun-failed.mjs"
            editions:
              - "src-tauri/**"
              - "scripts/cowork-desktop-build.sh"
              - "scripts/check-desktop-editions.mjs"
              - ".github/workflows/test.yml"
            install:
              - "install.sh"
              - "install.ps1"
              - "scripts/test-install-stop.sh"
              - ".github/workflows/test.yml"

  # 工作流文件本身的语法：2026-11-13 ai-qa.yml 的 run-name 里一个没加引号的「 #」让整个文件失效，PR 上的 Test 一点没发现
  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # 不查 shell 脚本（shellcheck 另说）；choice 里的空字符串 "" 是故意的（「不选」），GitHub 认
          ./actionlint -shellcheck= -pyflakes= -ignore 'string should not be empty' .github/workflows/*.yml
      - name: 调用方给的权限够被调用的 workflow 用
        run: python3 scripts/check-workflow-permissions.py .github/workflows
      # report-status.yml 调的两个脚本：自动重跑偶发失败、合并闸（它们只在合并后的 main 上跑，PR 上只能靠这里的测试）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: CI 脚本的测试
        run: node --test scripts/ci/*.test.mjs

  frontend-lint:
    name: Frontend lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint .
      - name: Browser agent bundle matches its source
        # `src-tauri/src/browser/js/agent.bundle.js` is committed so that a
        # cargo build needs no node — `include_str!` reads it at compile time.
        run: pnpm browser:agent:check
      - name: Browser agent typecheck
        run: pnpm browser:agent:types
      - name: Typecheck (tests included)
        # 上游 0.43 起 `next build` 用 tsconfig.build.json，不再检查 *.test.ts(x)；vitest 不查类型、ESLint 也不带类型信息，
        # 测试文件的类型只有这一步查。堆同 build：整个程序超过 Node 默认的 2G
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec tsc --noEmit

  frontend-build:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Static export build
        # next build 的类型检查在这个代码量下超过 Node 默认的 2G 堆
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  # vitest 几百个文件、jsdom，单机十几分钟：切成 6 片并行，每片独占一台机器
  vitest:
    name: Frontend vitest (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        # 挂掉的用例（最多 3 条、报告完整）所在的文件单独重跑一次，都过了就放行；重跑才过的每条留一个 ::warning 注解、
        # 写进这一步的 summary（scripts/ci/rerun-failed.mjs；源仓库 .cowork/journal/2026-11-16-ci-in-step-retry.md）
        run: >-
          node scripts/ci/rerun-failed.mjs vitest "Frontend vitest (${{ matrix.shard }}/6)"
          "pnpm vitest run --shard=${{ matrix.shard }}/6"
          "pnpm vitest run --reporter=verbose"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Cowork fork：只交付 Linux 上的 codeg-server，上游的 3 平台 × desktop/server 矩阵裁成 Linux 上的 server + cli + desktop 三格。
    # desktop 不出包，但桌面改动只有这里编过。要恢复上游矩阵看 upstream 的 test.yml
    name: Rust ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # 托管机器 4 核 16G。`--bin codeg-server --lib` 要编两份主 crate（bin 用的 lib 和测试版 lib），一个 rustc 高峰 7～9G，
      # 两个并行刚好顶到 16G，再多就会被杀（"hosted runner lost communication"），所以限 2。增量编译关掉：每次都是新机器用不上
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        mode: [server]
        include:
          - mode: desktop
            # 桌面（`tauri-runtime`，默认 feature）那一侧：只做类型检查（clippy，`--tests` 把单元测试也检查了），
            # 不 `cargo test`：桌面 crate 的测试二进制要 codegen + 链接，太重。`test-utils` 开着是因为没有它 `db::test_helpers` 等不编。
            # 以前 clippy 前面还有一步参数一模一样的 cargo check：clippy 本来就做完 check 的全部检查，那一步只是把主 crate 多查一遍（2026-11-16 删）
            check_only: true
            clippy_args: "--features test-utils --lib --tests"
          - mode: server
            cargo_args: "--no-default-features --features server-bin --bin codeg-server --lib"
            clippy_args: "--no-default-features --features server-bin --bin codeg-server --lib"
          - mode: cli
            cargo_args: "--no-default-features --features cli-bin --lib"
            # 只跑 cli:: 下的测试；重跑时不带（拼的是完整的测试名）
            test_filter: "cli::"
            clippy_args: "--no-default-features --features cli-bin --bin codeg-cli --lib"
    steps:
      - uses: actions/checkout@v4

      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          [[ -n "$channel" ]] || { channel=stable; echo "::warning::没读到 rust-toolchain.toml 的 channel（这个提交还没有这个文件？），用 stable"; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Rust cache
        # 只缓存依赖；慢的是 codeg_lib 这一个大 crate，每个 PR 都改它，每次重编
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-ubuntu-22.04-${{ matrix.mode }}
          # 失败了也存缓存：不然一直过不了就一直是冷编译
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: matrix.mode == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Tauri frontendDist placeholder
        # Tauri 的 build script 会检查 `frontendDist` 存在；真的静态导出归 frontend job，这里只要路径在
        if: matrix.mode == 'desktop'
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html

      - name: 腾磁盘（target 目录大；不加 swap——内存不够时宁可快点失败）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1; free -h | sed -n '2p'

      - uses: actions/setup-node@v4
        # cargo test 经 scripts/ci/rerun-failed.mjs 跑
        if: ${{ !matrix.check_only }}
        with:
          node-version: 24

      - name: sshd（host_ssh 的测试要起真的）
        # `host_ssh` 的测试用普通账号起系统的 sshd（只听 127.0.0.1、临时密钥），托管机器上不一定装了 openssh-server。
        # 下面的 CODEG_HOST_SSH_TEST_STRICT 让「没装所以跳过」变成失败，免得这几个测试悄悄不跑
        if: matrix.mode == 'server'
        run: test -x /usr/sbin/sshd || (sudo apt-get update && sudo apt-get install -y openssh-server)

      - name: cargo test
        id: test
        if: ${{ !matrix.check_only }}
        working-directory: src-tauri
        env:
          CODEG_HOST_SSH_TEST_STRICT: ${{ matrix.mode == 'server' && '1' || '' }}
        # 挂掉的测试（最多 3 条、每个没过的测试程序都报完了）用 --exact 单独重跑一次，都过了就放行，记录和 vitest 一样
        # （scripts/ci/rerun-failed.mjs）。--no-fail-fast：不然第一个挂了的测试程序后面的都没跑，只重跑挂掉的几条会漏测
        run: >-
          node ../scripts/ci/rerun-failed.mjs libtest "Rust ${{ matrix.mode }}"
          "cargo test ${{ matrix.cargo_args }} --no-fail-fast ${{ matrix.test_filter }}"
          "cargo test ${{ matrix.cargo_args }} --no-fail-fast -- --exact"

      - name: cargo clippy
        # 测试没过也照样跑：不然这一轮只报测试，修好了下一轮才报 clippy，多来回一次（#223 就是这样）
        if: ${{ success() || steps.test.outcome == 'failure' }}
        working-directory: src-tauri
        run: cargo clippy ${{ matrix.clippy_args }} -- -D warnings

      - name: Superpowers standalone skill helper layouts
        # executing-plans ships local copies of its sibling helpers so the skill works when codeg has to copy only one
        # skill on Windows. Pure bash + git, once is enough.
        if: matrix.mode == 'desktop'
        run: bash scripts/test-superpowers-skill-layouts.sh

      - name: Web handlers must route through commands/*_core
        # web/handlers/{folders,conversations}.rs must not call DB services directly: they delegate to a
        # `_core` function in `commands/*.rs` so the Tauri command and HTTP entrypoints share one implementation.
        working-directory: src-tauri
        run: |
          if grep -nE 'folder_service::|conversation_service::|tab_service::|import_service::' \
             src/web/handlers/folders.rs \
             src/web/handlers/conversations.rs; then
            echo "::error::Web handlers must call commands/*_core, not services directly."
            exit 1
          fi

  # 桌面包（只有一种，完整版）的 Tauri 配置叠法：externalBin、updater、identifier，以及去掉的纯客户端版没有留下 feature / 配置。
  # 不编译，几秒。编出来的包在 desktop-macos.yml 核对：tag、每晚的 main、PR 打 macos-build 标签
  # 格式只有这里查：本机（生产机）不许跑 rustfmt。只查这次加了、改了的行（main 上和上一次通过的提交比；PR 上和它从 main 分出来的地方比，
  # 不和 main 的最新比：落后的分支会把别人后来合进来的改动反着算成自己的）：
  # 老代码从来没跑过 rustfmt，全量格式化要改 300 个文件，以后每批搬 upstream 都会冲突（scripts/rustfmt-changed-lines.py）。
  # 没过就把这些行该改成的样子存成产物 rustfmt-patch，下载下来在仓库根目录 `git apply` 就行（AGENTS.md「CI 上常挂的错误」）
  rust-fmt:
    name: Rust fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 要往回找 PR 从 main 分出来的地方（或 main 上一次通过的提交）
          fetch-depth: 0
      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          [[ -n "$channel" ]] || { channel=stable; echo "::warning::没读到 rust-toolchain.toml 的 channel（这个提交还没有这个文件？），用 stable"; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: 这次改了的行格式对不对
        id: fmt
        env:
          MAIN_BASE: ${{ needs.changes.outputs.base }}
        run: |
          base=${MAIN_BASE:-pr}
          (cd src-tauri && cargo fmt --all)
          if ! python3 -I scripts/rustfmt-changed-lines.py "$base" "$RUNNER_TEMP/rustfmt.patch"; then
            echo "::error::这次改了的 Rust 行格式不对。下载产物 rustfmt-patch，在仓库根目录 git apply rustfmt.patch：gh run download ${{ github.run_id }} -R ${{ github.repository }} -n rustfmt-patch"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && steps.fmt.outcome == 'failure'
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7

  # 只在 macOS 上编的代码（`#[cfg(target_os = "macos")]`，2026-11-15 有 61 个文件、396 处：computer、browser、host_ssh……）
  # 上面 Linux 的三格都不编。以前只有打了 macos-build 标签的 PR、每晚编 main、合并后发版那一班才编到，错了要合并以后才知道。
  # 公开仓库的 macOS 机器不收费。macos-15 是 3 核 7G，一次只跑一个 rustc（lib 和测试版 lib 同时查会顶到内存）
  rust-macos:
    name: Rust desktop on macOS
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          [[ -n "$channel" ]] || { channel=stable; echo "::warning::没读到 rust-toolchain.toml 的 channel（这个提交还没有这个文件？），用 stable"; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-macos-15-desktop
          cache-on-failure: true
      - name: Prepare Tauri frontendDist placeholder
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --features test-utils --lib --tests -- -D warnings

  desktop-editions:
    name: Desktop editions
    needs: changes
    if: needs.changes.outputs.editions == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-desktop-editions.mjs

  install-sh:
    # install.sh stops what runs the files it replaces, and nothing else. The test runs the script's stop section
    # against fake programs; the installer itself is not run. Linux runs it once more as root.
    name: install.sh on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh parses
        run: /bin/bash -n install.sh
      - name: install.sh stops only what runs the files it replaces
        env:
          CODEG_INSTALL_TEST_STRICT: "1"
        run: /bin/bash scripts/test-install-stop.sh install.sh
      - name: The same, as root
        if: runner.os == 'Linux'
        run: sudo CODEG_INSTALL_TEST_STRICT=1 /bin/bash scripts/test-install-stop.sh install.sh

  install-ps1:
    # Two Windows PowerShell 5.1 traps that PowerShell 7 never hits: a script without a BOM read in the ANSI code
    # page, and Join-Path with a third path.
    name: install.ps1 in Windows PowerShell 5.1
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check install.ps1 as Windows PowerShell 5.1 reads and runs it
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD "install.ps1"))
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $text = [System.Text.Encoding]::UTF8.GetString($bytes, 3, $bytes.Length - 3)
          } else {
            $text = [System.Text.Encoding]::Default.GetString($bytes)
          }
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
          if ($errors) {
            foreach ($e in $errors) {
              Write-Host "::error file=install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            exit 1
          }
          $bad = $false
          $calls = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst] -and
              $node.GetCommandName() -eq "Join-Path"
          }, $true)
          foreach ($call in $calls) {
            $paths = @($call.CommandElements | Select-Object -Skip 1 | Where-Object {
              $_ -isnot [System.Management.Automation.Language.CommandParameterAst]
            })
            if ($paths.Count -gt 2) {
              Write-Host "::error file=install.ps1,line=$($call.Extent.StartLineNumber)::Join-Path with $($paths.Count) paths fails in Windows PowerShell 5.1"
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
