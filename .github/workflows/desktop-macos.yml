# 公开镜像 Tinghecui/dodoer-releases 的桌面版 dodoer.app（macOS arm64，固定的自签名证书签名；文件在私有仓库 cowork-codeg 的
# .github/public/workflows/ 里维护）。跑在 GitHub 托管的 macOS 机器上，公开仓库不收费。
# 编法、冒烟、打包都在 scripts/cowork-desktop-build.sh 里。只有一种包（完整版，自带 codeg-server；2026-11-09 去掉了纯客户端版），
# 一台机器编前端、sidecar 和主程序，最后 publish 发版。
#
# - tag cowork-codeg-vX.Y.Z 同步过来：编正式版，版本号 1.Y.Z，发到本仓库的 Release v1.Y.Z：安装 zip（带版本号的一份，
#   加上不带版本号的 dodoer-macos-arm64.zip 和门户下载链接用的 dodoer-client-macos-arm64.zip，内容一样）、
#   自动更新用的 .app.tar.gz + .sig、latest.json 和 latest-client.json（两个都指这个包：装过纯客户端版的 app 从
#   latest-client.json 查更新，这样就更新成完整版）。装好的 app 从 releases/latest/download/latest(-client).json 查更新
# - 每晚（北京时间 02:37）编一次 main，冒烟、不发：PR 上只查配置（test.yml 的 Desktop editions），编出来的包最晚第二天知道。
#   main 的这个提交已经有一次成功的 desktop-macos（前一晚、或者打 tag 发版那次）就跳过
# - 私有 PR 打了 macos-build 标签：public-sync 把它同步到 macos/pr/<n>，这里编、冒烟、不发，结果报回那个 PR（「公开 CI / desktop-macos」）。
#   PR 再推会重编（上一次没编完的取消），去掉标签或关掉 PR 就删 macos/pr/<n>
# - 手动触发（Actions → desktop-macos → Run workflow）：编任意分支只放 artifact；ref 填正式版 tag 并勾 publish 可以补发
# - release-train.yml 调它（workflow_call，train 为真）：product 每合一次就编触发的那个提交、发下一个修订版。tag 还没有，
#   Release 建在这个提交上；发之前等这个提交的 Test 过（scripts/cowork-wait-test.sh），说明用调用方给的改动清单
#
# 自动更新包用 TAURI_SIGNING_PRIVATE_KEY（+ _PASSWORD）签，签名绑定版本号（requireSignedVersion）。私钥丢了已经装好的 app 就再也收不到更新。
# app 本身用 DODOER_CODESIGN_P12（+ _PASSWORD）里的自签名证书签（不是 Apple 开发者证书，「无法验证开发者」照旧）：macOS 的
# 屏幕录制、辅助功能、钥匙串「始终允许」记的是签名证书，证书不变，更新以后这些授权就还在。ad-hoc 签名记的是每一版自己的哈希，
# 每更新一次就悄悄失效一次（开关还亮着）。证书备份在生产机 /root/dodoer-codesign/（只有 root 能读）；丢了可以换一张，代价是
# 换证书的那一版装上以后，大家要重新授权一次。
# 公开仓库的日志和 artifact 谁都能看：步骤里别打印代码之外的东西（密钥都走 secrets，会被打码）。
name: desktop-macos

on:
  push:
    tags: ["cowork-codeg-v*"]
    branches: ["macos/pr/**"]
  schedule:
    # 不放整点：GitHub 整点的定时任务最挤，会晚很久或者干脆丢掉（2026-11-07 第一晚 18:00 的那次就没跑）
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "要编的分支 / tag / 提交"
        required: false
        default: main
      product_name:
        description: "界面上的产品名"
        required: false
        default: dodoer
      publish:
        description: "ref 是 cowork-codeg-vX.Y.Z 时发 Release（补发用）"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      tag:
        description: "要发的 cowork-codeg-vX.Y.Z（还没有这个 tag）；编的是调用方触发的那个提交"
        type: string
        required: true
      notes:
        description: "Release 说明里的改动清单（markdown），也是 latest.json 的 notes"
        type: string
        required: false
        default: ""
      train:
        description: "自动发版：发之前等这个提交的 Test 过"
        type: boolean
        required: false
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      DODOER_CODESIGN_P12:
        required: true
      DODOER_CODESIGN_PASSWORD:
        required: true

permissions:
  contents: read

# 发版一组、不取消；自动发版单独一组（release-train.yml 自己一次只跑一班），别和每晚的 main 排在一组里被顶掉；
# macos/pr/<n> 每个 PR 一组，新推的取消没编完的；每晚和手动触发按 ref 一组
concurrency:
  group: desktop-macos-${{ inputs.train && 'train' || (startsWith(github.ref, 'refs/tags/') && 'release' || github.ref) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/macos/pr/') }}

jobs:
  # 版本号、发不发、要不要编（每晚的 main 已经成功编过就不编）
  prepare:
    name: 版本号、要不要编
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 分支推送按提交 sha 取：macos/pr/<n> 在 PR 合并、关闭时就删了，比这里跑完早（同 cowork-release.yml）
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}

      # 桌面版本号 = 1.<次>.<修订>，跟着 cowork-codeg 的 tag 走（v0.2.5 → 1.2.5）：自动更新按 semver 比大小，只能往上走
      - id: meta
        name: 版本号、发不发
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^cowork-codeg-v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ -n "$TAG_INPUT" ]]; then
            # release-train.yml：要发的号由它定，tag 发 Release 时才建
            tag="$TAG_INPUT"; publish=true
          elif [[ "$REF" =~ $tag_re ]]; then
            tag="$REF"
            if [[ "$GITHUB_EVENT_NAME" == push || "$PUBLISH_INPUT" == true ]]; then publish=true; else publish=false; fi
          else
            # 开发版：用最近一个正式版的号，不发
            tag=$(git ls-remote --tags --refs origin 'cowork-codeg-v*' | sed 's#.*refs/tags/##' \
              | grep -E "$tag_re" | sort -V | tail -1)
            publish=false
          fi
          [[ "$tag" =~ $tag_re ]] || { echo "::error::没找到 cowork-codeg-vX.Y.Z（ref=${REF}）"; exit 1; }
          if [[ "${BASH_REMATCH[1]}" != 0 ]]; then
            echo "::error::$tag 的主版本不是 0，桌面版本号规则（1.<次>.<修订>）要重新定"; exit 1
          fi
          version="1.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$tag → dodoer ${version}，publish=$publish"

      - id: gate
        name: 要不要编
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # 自动发版那次编的桌面包算在 release-train 的 run 里
            prev=""
            for wf in desktop-macos.yml release-train.yml; do
              [[ -n "$prev" ]] || prev=$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf" -c "$GITHUB_SHA" -s success -L 1 \
                --json databaseId,event -q '.[0] | select(.) | "\(.databaseId)（\(.event)）"' || true)
            done
            if [[ -n "$prev" ]]; then
              build=false
              echo "main 的 ${GITHUB_SHA:0:12} 已经编过：run ${prev}，今晚不编" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: dodoer.app (macOS arm64)
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PRODUCT_NAME: ${{ inputs.product_name || 'dodoer' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # 只缓存依赖，codeg 每次重编
          shared-key: desktop-macos

      - name: pnpm（corepack，按 package.json 的 packageManager）
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          node --version; pnpm --version; rustc --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-macos-
      - run: pnpm install --frozen-lockfile

      # 证书导进一个临时钥匙串，加进搜索列表让 codesign 找得到；身份用证书的 SHA-1 指定（自签名证书不受信任，
      # find-identity -v 列不出它，按名字找不稳，codesign 按哈希找不看信任）
      - name: 签名证书（临时钥匙串）
        env:
          P12: ${{ secrets.DODOER_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.DODOER_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12" || -z "$P12_PASSWORD" ]]; then
            echo "::error::缺 Secret DODOER_CODESIGN_P12 / DODOER_CODESIGN_PASSWORD：不签名的包装上以后屏幕录制等授权会失效"
            exit 1
          fi
          kc="$RUNNER_TEMP/dodoer-codesign.keychain-db"
          kc_pw=$(openssl rand -hex 16)
          echo "::add-mask::$kc_pw"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/codesign.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          sha1=$(security find-certificate -c "dodoer code signing" -Z "$kc" | awk '/SHA-1 hash:/ {print $3}')
          if [[ ! "$sha1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::临时钥匙串里没有 dodoer code signing 证书"
            exit 1
          fi
          security find-identity -p codesigning "$kc"
          echo "DODOER_SIGNING_IDENTITY=$sha1" >> "$GITHUB_ENV"
          echo "DODOER_SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - id: build
        name: tauri build、冒烟、打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/cowork-desktop-build.sh full

      - name: 删掉临时钥匙串
        if: always()
        run: |
          if [[ -n "${DODOER_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DODOER_SIGNING_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.full_name }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # latest.json 和 latest-client.json 内容一样，都指向这次 Release 的 .app.tar.gz：装过纯客户端版（1.3.0 起有过）的 app
  # 从 latest-client.json 查更新，同一把签名私钥、同一个 identifier（app.codeg）、同一个数据目录，所以它就地更新成完整版。
  # 两个 json 在每个 Release 里都放一份，补发旧版本时不会把已经装了新版的人「更新」回去（app 只认更大的号）。
  # 编过、冒烟过才发
  publish:
    name: 发 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # 自动发版要在这里等 Test（一般早就跑完了，最多等 60 分钟）
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write # scripts/cowork-wait-test.sh 查 Test、没过时重跑一次
    steps:
      - uses: actions/checkout@v4
        with:
          # 自动发版的 tag 还没有，按提交取
          ref: ${{ inputs.train && github.sha || needs.prepare.outputs.tag }}
      - id: gate
        name: 等这个提交的 Test 过（自动发版）
        if: inputs.train
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cowork-wait-test.sh "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.train || steps.gate.outputs.ok == 'true' }}
        with:
          path: dist
          merge-multiple: true
      - name: 发 Release
        if: ${{ !inputs.train || steps.gate.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES_INPUT: ${{ inputs.notes }}
          TRAIN: ${{ inputs.train }}
        run: |
          set -euo pipefail
          # 文件名按 cowork-desktop-build.sh 的规则找（不经 job outputs 传）
          one() { local f; f=$(cd dist && ls $1 2>/dev/null) || true
                  [[ $(printf '%s\n' "$f" | grep -c .) == 1 ]] || { echo "::error::dist/ 里 $1 要正好一个，现在：${f:-没有}" >&2; ls -la dist >&2; exit 1; }
                  printf '%s' "$f"; }
          NAME=$(one "dodoer-$VERSION-*-macos-arm64.zip"); NAME="${NAME%.zip}"
          UPDATER=$(one "dodoer-$VERSION-macos-arm64.app.tar.gz")
          ALIAS=$(one "dodoer-macos-arm64.zip")
          CLIENT_ALIAS=$(one "dodoer-client-macos-arm64.zip")
          rel="v$VERSION"
          if [[ -n "$NOTES_INPUT" ]]; then
            notes="$NOTES_INPUT"
          else
            git fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            subject=$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)
            notes="${subject:-$TAG}"
          fi
          for out in latest.json latest-client.json; do
            jq -n --arg version "$VERSION" --arg notes "$notes" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$(cat "dist/$UPDATER.sig")" \
              --arg url "https://github.com/$RELEASE_REPO/releases/download/$rel/$UPDATER" \
              '{version: $version, notes: $notes, pub_date: $pub_date,
                platforms: {"darwin-aarch64": {signature: $signature, url: $url},
                            "darwin-aarch64-app": {signature: $signature, url: $url}}}' > "dist/$out"
            echo "== $out"; cat "dist/$out"
          done
          body=$(printf '%s\n\n对应 %s。\n\n安装包 `%s.zip`（也叫 `%s`；`%s` 是同一个文件，给门户的下载链接用）。打开后在开始页选「在这台电脑上工作」或者一台服务器，本机和服务器上的工作区可以同时开着。\n\n已经装了 dodoer 的（包括以前的纯客户端版），app 里会提示更新，点更新、重启就是这一版。\n第一次装：解压后把 dodoer.app 拖进「应用程序」，再在终端执行 `xattr -dr com.apple.quarantine /Applications/dodoer.app`（没有 Apple 开发者签名）。\n' \
            "$notes" "$TAG" "$NAME" "$ALIAS" "$CLIENT_ALIAS")
          # release-train.yml 按这个标记删老的自动版本。tag v$VERSION 建在编的这个提交上（手动 tag 也是，不再建在 main 上）：
          # 桌面 app「回退到上一版」之前，从上一版 tag 的源码读它认的数据库迁移（src-tauri/src/update/rollback.rs）
          target=$(git rev-parse HEAD)
          if [[ "$TRAIN" == true ]]; then body=$(printf '%s\n\n%s' "$body" "<!-- release-train -->"); fi
          files=("dist/$NAME.zip" "dist/$NAME.zip.sha256" "dist/$ALIAS" "dist/$ALIAS.sha256"
                 "dist/$CLIENT_ALIAS" "dist/$CLIENT_ALIAS.sha256"
                 "dist/$UPDATER" "dist/$UPDATER.sig" dist/latest.json dist/latest-client.json)
          if gh release view "$rel" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$rel" -R "$RELEASE_REPO" --clobber "${files[@]}"
          else
            # --latest：本仓库也放 server 包的 Release，Latest 要明确给桌面版（app 从 releases/latest/download/ 查更新）
            gh release create "$rel" -R "$RELEASE_REPO" --target "$target" --latest \
              --title "dodoer ${VERSION}（${TAG}）" --notes "$body" "${files[@]}"
          fi
          echo "### dodoer $VERSION 已发布：https://github.com/$RELEASE_REPO/releases/tag/$rel" >> "$GITHUB_STEP_SUMMARY"
