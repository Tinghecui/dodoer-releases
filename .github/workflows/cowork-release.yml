# 公开镜像 Tinghecui/dodoer-releases 的 Linux x64 服务端包（文件在私有仓库 cowork-codeg 的 .github/public/workflows/ 里维护）：
# tag cowork-codeg-vX.Y.Z 同步过来就出包、冒烟、发到本仓库的 Release；改了打包脚本、依赖清单的 pr/<n> 分支也跑一遍（到冒烟为止，不发布）。
# qa-package.yml 也调它（workflow_call）：私有仓库的 AI QA 要测还没发版的代码时推 qa/<run> 分支过来，编到冒烟为止、不发布，产物给 AI QA 下载。
# release-train.yml 也调它（train 为真）：product 每合一次就发下一个修订版，Test 过了才发（scripts/cowork-wait-test.sh），说明用调用方给的改动清单。
# 手动 tag 发完给 cowork 开 runtime.lock 的 PR（最后一步，要 Secret COWORK_REPO_TOKEN，没配就跳过）；自动发版不开。
# 全部在 GitHub 托管的 ubuntu-22.04 上（glibc 2.35），编出来的二进制要求 glibc >= 2.35。
name: cowork-release

on:
  push:
    tags: ["cowork-codeg-v*"]
    branches: ["pr/**"]
    paths:
      - ".github/workflows/cowork-release.yml"
      - "scripts/cowork-release-build.sh"
      - "scripts/cowork-package-smoke.sh"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release 的 tag 名（cowork-codeg-vX.Y.Z）；要已经存在。不填只构建、冒烟，不发布"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "同 workflow_dispatch；qa-package.yml 不传，只构建、冒烟。release-train.yml 传下一个修订版（tag 还没有，发 Release 时建在 ref 上）"
        type: string
        required: false
        default: ""
      ref:
        description: "编哪个提交；不传就按 version（tag）或触发的提交"
        type: string
        required: false
        default: ""
      notes:
        description: "Release 说明里的改动清单（markdown）"
        type: string
        required: false
        default: ""
      train:
        description: "自动发版：发之前等这个提交的 Test 过，不给 cowork 开 PR"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: cowork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: cowork-codeg-server-linux-x64

jobs:
  frontend:
    name: 前端静态导出
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 分支推送按提交 sha 取代码，不按分支名：PR 用 auto-merge 合得比这里跑完早，合并时公开的 pr/<n> 已经删了，
          # 后面的 job 再按分支名取就是 couldn't find remote ref（2026-11-12 #117）。sha 在分支删掉后还取得到。tag 照旧按 tag
          ref: ${{ inputs.ref || inputs.version || (github.ref_type == 'branch' && github.sha) || github.ref }}
      # server 会叫比 MIN_DESKTOP_VERSION 旧的桌面 app 去更新（src-tauri/src/compat.rs）。这个 tag 自己编出来的桌面 app
      # 是 1.<次>.<修订>（desktop-macos.yml），它要是比这个最低版本还旧，用户点「检查更新」就永远更新不到够新的版本
      - name: 这个 tag 的桌面 app 不低于 server 要求的最低版本
        if: github.ref_type == 'tag'
        run: |
          min=$(sed -n 's/^pub const MIN_DESKTOP_VERSION: &str = "\(.*\)";$/\1/p' src-tauri/src/compat.rs)
          tag="${GITHUB_REF_NAME#cowork-codeg-v}"
          desktop="1.${tag#*.}"
          [[ "$min" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$desktop" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::读不出版本：MIN_DESKTOP_VERSION=$min，tag=$GITHUB_REF_NAME"; exit 1; }
          if [[ "$(printf '%s\n%s\n' "$min" "$desktop" | sort -V | head -1)" != "$min" ]]; then
            echo "::error::$GITHUB_REF_NAME 的桌面 app 是 $desktop，比 compat.rs 的 MIN_DESKTOP_VERSION（$min）旧。换一个更高的 tag，或者调低 MIN_DESKTOP_VERSION"
            exit 1
          fi
          echo "桌面 app $desktop ≥ MIN_DESKTOP_VERSION $min"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: pnpm build（静态导出到 out/）
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=4096
          # service worker 的缓存按它分版本（next.config.ts）；pr/** 分支没有 tag，退回 package.json 的版本
          COWORK_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: pnpm build && test -f out/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out
          retention-days: 1
          if-no-files-found: error

  backend:
    name: codeg-server、codeg-mcp、codeg-cli（release）
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # 4 核 16G：release 编译一个 rustc 也要好几 G，限 2 个并行
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.version || (github.ref_type == 'branch' && github.sha) || github.ref }}
      - name: 腾磁盘、装 openssl 头文件
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
          sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-ubuntu-22.04
          cache-on-failure: true
      - name: cargo build --release
        working-directory: src-tauri
        run: |
          cargo build --release --bin codeg-server --no-default-features --features server-bin
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin
          # 员工终端和 agent 里的 codeg-cli 命令：codeg-server 启动时把包里它所在的目录放到 PATH 最前（cowork-codeg #171）
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin
          mkdir -p ../dist/bin && cp target/release/codeg-server target/release/codeg-mcp target/release/codeg-cli ../dist/bin/
          strip ../dist/bin/codeg-server ../dist/bin/codeg-mcp ../dist/bin/codeg-cli
          ls -la ../dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: dist/bin
          retention-days: 1
          if-no-files-found: error

  package:
    name: 打包、冒烟、发布
    needs: [frontend, backend]
    runs-on: ubuntu-22.04
    # 自动发版要在这里等 Test（一般早就跑完了，最多等 60 分钟）
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write # scripts/cowork-wait-test.sh 查 Test、没过时重跑一次
    env:
      COWORK_REPO_TOKEN: ${{ secrets.COWORK_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.version || (github.ref_type == 'branch' && github.sha) || github.ref }}

      - id: meta
        name: 版本号
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="${INPUT_VERSION}"; fi
          if [ -n "$v" ] && ! [[ "$v" =~ ^cowork-codeg-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then echo "tag 名不对：$v"; exit 1; fi
          echo "version=${v:-dev-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"
          echo "publish=$([ -n "$v" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: dist/bin

      - name: 打包（scripts/cowork-release-build.sh 的 package 一步）
        env:
          COWORK_DOCKER: docker # 只是让脚本别去找 gha-runner 用户；package 一步不碰 docker
          COWORK_VERSION: ${{ steps.meta.outputs.version }}
        run: chmod 755 dist/bin/* && bash scripts/cowork-release-build.sh "$PWD" package

      - name: 冒烟（debian:bookworm-slim 里按 codeg@.service 的环境起一次）
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/dist/$NAME.tar.gz:/pkg.tar.gz:ro" -v "$PWD/scripts:/s:ro" debian:bookworm-slim \
            bash /s/cowork-package-smoke.sh | tee dist/smoke.txt
          tail -1 dist/smoke.txt | grep -q "CHECK failures: 0$" || { echo "冒烟有失败项"; exit 1; }
          for b in codeg-server codeg-mcp codeg-cli; do grep -q "$b missing libs: 0" dist/smoke.txt || { echo "$b 缺共享库（或包里没有）"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.tar.gz.sha256
            dist/smoke.txt
          retention-days: 14

      - id: gate
        name: 等这个提交的 Test 过（自动发版）
        if: steps.meta.outputs.publish == 'true' && inputs.train
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cowork-wait-test.sh "$(git rev-parse HEAD)"

      # 本仓库的「Latest」必须一直是桌面版 v1.Y.Z：装好的 app 从 releases/latest/download/latest(-client).json 查更新，
      # server 包的 Release 一旦成了 Latest，这两个地址就 404、桌面版收不到更新。所以这里固定 --latest=false。
      # tag 带后缀（cowork-codeg-vX.Y.Z-test.1 这种，演练用）的标成 prerelease。
      - name: 发 Release（已有同名 Release 就只替换资产）
        if: steps.meta.outputs.publish == 'true' && (!inputs.train || steps.gate.outputs.ok == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ inputs.notes }}
          TRAIN: ${{ inputs.train }}
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            pre=(); [[ "$VERSION" =~ ^cowork-codeg-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || pre=(--prerelease)
            # 版本号 0.Y.Z 对应桌面 app 1.Y.Z（desktop-macos.yml）；底座是 package.json 的版本（upstream codeg 的）
            v="${VERSION#cowork-codeg-v}"
            body="Cowork 用的 codeg-server（基于 codeg v$(jq -r .version package.json)）。桌面 app 对应 v1.${v#*.}。"
            if [[ "$TRAIN" == true ]]; then body="${body}合并到 product 后自动发的。"; fi
            body=$(printf '%s\n\n%s' "$body" "资产：$NAME.tar.gz（linux x64，glibc >= 2.35）及 .sha256")
            if [[ -n "$NOTES" ]]; then body=$(printf '%s\n\n%s' "$body" "$NOTES"); fi
            # release-train.yml 按这个标记删老的自动版本
            if [[ "$TRAIN" == true ]]; then body=$(printf '%s\n\n%s' "$body" "<!-- release-train -->"); fi
            # tag 还没有（自动发版）就建在编的这个提交上；已经有了 --target 不起作用
            if ! gh release create "$VERSION" --latest=false "${pre[@]}" --target "$(git rev-parse HEAD)" --title "$VERSION" --notes "$body" \
                   2>"$RUNNER_TEMP/create.err"; then
              cat "$RUNNER_TEMP/create.err" >&2
              # 不改建在 main 上（桌面包那边会）：release-train 按这个 tag 算「上次发到哪」，建在 main 上就把没编进这个包的提交也算成发过了
              if grep -q 'HTTP 403' "$RUNNER_TEMP/create.err"; then
                echo "::error::tag $VERSION 建不到编的这个提交（$(git rev-parse HEAD)）上：编的时候 main 上又合了改 .github/workflows 的提交，GITHUB_TOKEN 不能把 tag 建在 workflow 跟 main 不一样的提交上。这一班的 server 包没发，下一次合并到 product 会用同一个版本号连这些改动一起发"
              fi
              exit 1
            fi
            cat "$RUNNER_TEMP/create.err" >&2
          fi
          gh release upload "$VERSION" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" --clobber
          cat "dist/$NAME.tar.gz.sha256"

      # 发完顺手给 cowork 开 PR：deploy/runtime.lock 指到这个 tag 和包的 sha256、package.json 的 patch 版本 +1、CHANGELOG 里新建这个版本的一节并加一条，
      # 再把 cowork 攒在 changelog.d/ 里还没发版的条目收进去。
      # 需要 secret COWORK_REPO_TOKEN：对 Tinghecui/cowork 有 Contents、Pull requests 写权限的 fine-grained token；没配就跳过这一步
      - name: 给 cowork 开 runtime.lock 的 PR
        if: steps.meta.outputs.publish == 'true' && env.COWORK_REPO_TOKEN != '' && !inputs.train
        env:
          GH_TOKEN: ${{ env.COWORK_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 "dist/$NAME.tar.gz.sha256")
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Tinghecui/cowork.git" /tmp/cowork
          cd /tmp/cowork
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="codeg/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "cowork 已经有分支 $branch，不重复开"; exit 0; fi
          git switch -c "$branch"
          sed -i -E "s|^codeg=.*|codeg=$VERSION|; s|^codeg-linux-x64-sha256=.*|codeg-linux-x64-sha256=$sha|" deploy/runtime.lock
          # ACP 适配器：cowork 全局装一份给所有员工的 codeg 用（AI QA #109），版本跟这个 tag 的 registry.rs 里钉的一致，
          # 写进 runtime.lock 的 acp-<命令>=（老的 cowork 没有这几行就不加）
          adapters=""
          for a in claude-agent-acp codex-acp; do
            v=$(sed -n -E "s|^ *package: \"@agentclientprotocol/$a@([0-9][^\"]*)\",.*|\1|p" "$GITHUB_WORKSPACE/src-tauri/src/acp/registry.rs" | head -n 1)
            [ -n "$v" ] || { echo "registry.rs 里找不到 $a 钉的版本"; exit 1; }
            if grep -q "^acp-$a=" deploy/runtime.lock; then
              sed -i -E "s|^acp-$a=.*|acp-$a=$v|" deploy/runtime.lock
              adapters="$adapters $a@$v"
            fi
          done
          if git diff --quiet; then echo "runtime.lock 已经是 $VERSION，不开 PR"; exit 0; fi
          old=$(node -p "require('./package.json').version")
          new=$(npm version patch --no-git-tag-version); new=${new#v}
          today=$(TZ=Asia/Shanghai date +%F)
          awk -v new="$new" -v today="$today" -v v="$VERSION" -v url="$release_url" '
            !done && /^## / {
              done = 1
              if ($0 ~ /^## 未发布/) { print; print "" }
              print "## " new "（" today "）"; print ""; print "- **codeg runtime 升到 `" v "`**：" url; print ""
              if ($0 ~ /^## 未发布/) { skip = 1; next }
            }
            skip && /^$/ { skip = 0; next }
            { skip = 0; print }' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          # cowork 还没发版的更新记录一条一个文件放在 changelog.d/（2026-11-12 起，那边的 changelog.d/README.md）：用它自己的脚本收到上面
          # 刚建的这一节后面、删掉文件。没收的话那边 release.yml 的 meta 会把这个 PR 拦住。老的 cowork（没有这个脚本）照旧只靠上面的 awk
          if [ -f tools/changelog.mjs ]; then
            node tools/changelog.mjs "$new" --date "$today"
            git add -A changelog.d
          fi
          git add deploy/runtime.lock package.json CHANGELOG.md
          git commit -q -m "codeg runtime 升到 $VERSION（cowork $new）" -m "runtime.lock 的 codeg= 和 sha256 由 dodoer-releases 的 cowork-release 工作流写入。合并即发 cowork $new。"
          git push -q origin "$branch"
          gh pr create --repo Tinghecui/cowork --base main --head "$branch" \
            --title "codeg runtime 升到 $VERSION（cowork $old → $new）" \
            --body "$(printf '%s\n\n%s\n%s\n\n%s' \
              "dodoer-releases 的 \`cowork-release\` 自动开的：$release_url" \
              "- \`deploy/runtime.lock\`：\`codeg=$VERSION\`，sha256 \`$sha\`${adapters:+；ACP 适配器${adapters}}" \
              "- \`package.json\` $old → $new，CHANGELOG 新建了 $new 一节：codeg 这一条，加上 changelog.d/ 里攒的条目——按需要改改说明" \
              "合并到 main 就发 cowork $new（release.yml 看到 version 没有 tag 就打包、发 Release、打 tag）。")"
