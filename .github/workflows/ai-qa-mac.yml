# 公开镜像 Tinghecui/dodoer-releases：macOS 桌面 app 的改动验收（源仓库 .cowork/ai-qa/mac/，设计见那里的 README.md）。
# 和 ai-qa.yml 一样只是个壳：克隆源仓库、exec mac/sealed.sh；输出全进文件、传回源仓库的 Release「ai-qa-artifacts」，
# 这份日志里只有 AIQA-BEGIN、每个阶段一行进度、AIQA-END，运行结束后 ai-qa-seal.yml 核对。
# GitHub 自带的 macos-15 机器有图形登录，bash / osascript 预先有「辅助功能」「屏幕录制」授权（2026-11-18 试过：截图、按键、读界面元素、cliclick 都行）。
name: ai-qa-mac
run-name: "${{ format('ai-qa-mac {0} {1} {2}', inputs.batch, inputs.changes, inputs.employee || 'qa4') }}"

on:
  workflow_dispatch:
    inputs:
      changes:
        description: "要验收的 PR 号，逗号分隔（只抽查故事时留空）"
        default: ""
      stories:
        description: "抽查的用户故事：P0 / P1 = 该优先级全部（预发、PM 的除外），或编号 A1,C1,N5；和 changes 至少填一个"
        default: ""
      batch:
        description: "批次名（只用在报告里）"
        default: ""
      version:
        description: "被测的桌面版 tag，如 v1.6.93（空 = 最新 Release）"
        default: ""
      from_version:
        description: "先装这个旧版、再让它自己升级（测更新链用，如 v1.6.90；空 = 直接装被测版）"
        default: ""
      employee:
        description: "连验收机上的哪个员工（qa4–qa6 留给 Mac；同时跑的几批要连服务器时各用一个）"
        default: "qa4"
      driver:
        description: "怎么操作 Mac：cliclick（截图 + System Events + cliclick）、native（Claude Code 自带的 computer use，先探测，用不了就退回 cliclick）或 peekaboo（辅助功能树 MCP，按元素 ID 点；拿不到权限就红）"
        type: choice
        options: [cliclick, native, peekaboo]
        default: cliclick
      ref:
        description: "源仓库的分支（空 = 默认分支）。不是默认分支 = 试跑：只写 summary，不记台账、不评论 PR、不开 issue"
        default: ""
      max_turns:
        default: "600"
      minutes:
        description: "测试员最多跑多少分钟"
        default: "200"
      model:
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: macos-15
    environment: ai-qa
    timeout-minutes: 300
    env:
      SOURCE_REPO: Tinghecui/cowork-codeg
      PUBLIC_REPO: ${{ github.repository }}
      W: /Users/runner/ai-qa-work
      CHANGES: ${{ inputs.changes }}
      STORIES: ${{ inputs.stories }}
      BATCH: ${{ inputs.batch }}
      APP_VERSION: ${{ inputs.version }}
      FROM_VERSION: ${{ inputs.from_version }}
      EMPLOYEE: ${{ inputs.employee || 'qa4' }}
      DRIVER: ${{ inputs.driver || 'cliclick' }}
      REF: ${{ inputs.ref }}
      MAX_TURNS: ${{ inputs.max_turns || '600' }}
      MINUTES: ${{ inputs.minutes || '200' }}
      MODEL: ${{ inputs.model || vars.AIQA_MODEL || 'claude-opus-5-5' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: run
        env:
          AIQA_PRIVATE_TOKEN: ${{ secrets.AIQA_PRIVATE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          AIQA_CCR_CREDENTIALS: ${{ secrets.AIQA_CCR_CREDENTIALS }}
          AIQA_CCR_INSTALL_URL: ${{ secrets.AIQA_CCR_INSTALL_URL }}
          AIQA_VERIFY: ${{ secrets.AIQA_VERIFY }}
          AIQA_VERIFY_ACCOUNTS: ${{ secrets.AIQA_VERIFY_ACCOUNTS }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${AIQA_PRIVATE_TOKEN}@github.com/${SOURCE_REPO}.git"
          git init -q .
          git fetch -q --depth 1 "$url" "${REF:-HEAD}" 2>/dev/null || { echo "fetch failed"; exit 1; }
          git checkout -q --detach FETCH_HEAD
          # 试跑（ref 是非默认分支）：这个 workflow 总是从 main 来，脚本却来自那个分支。分支太旧、脚本还不认试跑的话，
          # 它会照常写台账、评论 PR、开 issue：认不出试跑标记（AIQA-TRIAL-GUARD）就不跑。AIQA_TRIAL 由这里定，不靠分支里的脚本自己判断
          if [[ -n "${REF:-}" ]]; then
            def=$(curl -fsSL -H "Authorization: Bearer ${AIQA_PRIVATE_TOKEN}" "https://api.github.com/repos/${SOURCE_REPO}" | jq -r .default_branch)
            [[ -n "$def" && "$def" != null ]] || { echo "查不到源仓库的默认分支"; exit 1; }
            if [[ "$REF" != "$def" ]]; then
              for f in .cowork/ai-qa/mac/run.sh .cowork/ai-qa/mac/record.mjs; do
                grep -q 'AIQA-TRIAL-GUARD' "$f" 2>/dev/null || { echo "::error::分支 $REF 的 $f 不认试跑（没有 AIQA-TRIAL-GUARD），跑了会写台账、评论 PR、开 issue。先把默认分支合进这个分支"; exit 1; }
              done
              export AIQA_TRIAL=1
              echo "试跑：源仓库分支 ${REF}（不记台账、不评论 PR、不开 issue）"
            fi
          fi
          exec bash .cowork/ai-qa/mac/sealed.sh
