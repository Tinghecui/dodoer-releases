# 公开镜像 Tinghecui/dodoer-releases：桌面版 e2e（文件在私有仓库 cowork-codeg 的 .github/public/workflows/ 里维护）。
# 在 GitHub 托管的 macos-15（arm64）和 ubuntu-22.04 上编桌面版的「e2e 测试版」（debug、cargo feature `e2e`、版本号 1.999.0，
# 前端带 @wdio/tauri-plugin），用 WebdriverIO + @wdio/tauri-service 驱动它：macOS 走 app 里内嵌的 WebDriver 服务器，
# Linux 走官方 tauri-driver。两边跑同一套 spec（scripts/desktop-e2e/specs/，scripts/desktop-e2e/run.sh 按段开几次 app = 退出重开）。
# macOS 上接着跑更新流程（scripts/desktop-e2e/update/：测试密钥签的 N / N+1 两个包 + 运行机上的假更新源）
# 和原生层（scripts/desktop-e2e/native/：Appium Mac2 按辅助功能树点菜单、托盘、窗口、对话框）。
# 来历：源仓库 .cowork/journal/2026-11-21-spike-macos-webdriver.md、2026-11-21-e2e-wdio-plugin.md、2026-11-21-desktop-e2e-skeleton.md、
# 2026-11-22-e2e-update-feed.md。
#
# 触发：
# - 私有 PR 打了 desktop-e2e 标签，或改到了 scripts/desktop-e2e/paths.txt 列的桌面文件：public-sync 推到 desktop/pr/<n>，这里跑，
#   结果报回 PR（「公开 CI / desktop-e2e」，report-status.yml）。只报告：不是必需检查、不关合并闸、不拦发版
# - 每晚 20:29 UTC（北京时间 04:29）跑公开 main（= product 头）。红了 report-status 报回 product 的那个提交，那边开 ci-red issue
# - workflow_call：留给 release-train 以后调（拦不拦发版用户还没定，现在没有调用方）；workflow_dispatch：手动跑选的分支
#
# 产物（截图、WebdriverIO 日志、app 日志、每一步的结果）先传成这次 run 的 artifact（留 1 天），desktop-e2e-artifacts.yml 在 run 结束后
# 把它们搬到私有仓库 Release「ai-qa-artifacts」、删掉公开的这份。公开日志里只有编译输出和摘要表（run.sh），WebdriverIO 的输出不进公开日志；
# ai-qa-seal.yml 照样按 denylist 核对每次 run 的日志。
# 编好的程序按源码哈希缓存（命中两三分钟一轮）；Rust 依赖的缓存只在 main 上存（PR 分支读得到 main 的缓存，不各存一份占配额）。
name: desktop-e2e

on:
  push:
    branches: ["desktop/pr/**"]
  schedule:
    # 避开 18:23 AI QA、18:37 desktop-macos、19:47 desktop-linux、21:00 desktop-macos-intel 和每小时 :17 / :41 那两个
    - cron: "29 20 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # workflow_call 时 github.workflow 是调用方的名字，所以带上事件名，不和 PR / 每晚的抢
  group: desktop-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  RUST_BACKTRACE: short
  # 同 desktop-linux.yml / test.yml：调试信息只留行号表、并行 2、不要增量
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: ${{ matrix.os }}：e2e 测试版 + WebdriverIO
    strategy:
      fail-fast: false
      matrix:
        # 以后加 macos-15-intel、windows-2025（源仓库 ~/work/reports 的方案 P3 / P5）
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # 按提交 sha 取：desktop/pr/<n> 在 PR 合并、关闭时就删了；也保证编的就是 report-status 报回去的那个提交
          ref: ${{ github.sha }}

      - name: 系统包（Linux：WebKitGTK、WebKitWebDriver、xvfb）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb dbus-x11

      # restore / save 分开：WebdriverIO 那步红了也要把编好的程序存下来，重跑才不用重编。
      # macOS 上连打好的 dodoer.app 一起存（更新流程测试拿它做 N / N+1 两个测试包，v3 起）。
      # out/（前端）也要存：只存 target/debug/web 时，命中缓存的那次 app 认不出 target/debug/web/index.html（多半 debug 版那里是指向
      # out/ 的链接），退回到不存在的 out/，网页服务 GET / 回 404（#1215 重跑那两次，app 日志「Fallback static dir」）。sidecar 的 codeg-server 也读 out/
      - name: 编好的程序（缓存）
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: |
            src-tauri/target/debug/codeg
            src-tauri/target/debug/codeg-server
            src-tauri/target/debug/codeg-mcp
            src-tauri/target/debug/codeg-cli
            src-tauri/target/debug/codeg-computer-helper
            src-tauri/target/debug/web
            src-tauri/target/debug/bundle/macos/dodoer.app
            out
          key: desktop-e2e-bin-v3-${{ runner.os }}-${{ hashFiles('src-tauri/**', 'src/**', 'public/**', 'patches/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'rust-toolchain.toml', '*.config.*') }}

      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"
      # Linux 命中缓存也要装：tauri-driver 在 ~/.cargo/bin，跟着 Rust 依赖的缓存走
      - name: Install Rust
        if: steps.bin.outputs.cache-hit != 'true' || runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Rust cache
        if: steps.bin.outputs.cache-hit != 'true' || runner.os == 'Linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-e2e
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: tauri-driver（Linux）
        if: runner.os == 'Linux'
        run: command -v tauri-driver || cargo install tauri-driver --locked

      - name: 腾磁盘（Linux）
        if: runner.os == 'Linux' && steps.bin.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: pnpm/action-setup@v4
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm install
        if: steps.bin.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: 前端（静态导出，e2e 版：带 @wdio/tauri-plugin）
        if: steps.bin.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # src/lib/e2e/wdio-plugin.ts：只有这样编的前端才带插件的前端那一半
          NEXT_PUBLIC_CODEG_E2E: "1"
        run: |
          set -euo pipefail
          t0=$(date +%s)
          pnpm build
          echo "- 前端 pnpm build：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: sidecar（codeg-server 等，debug）
        if: steps.bin.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo build --bin codeg-mcp --bin codeg-computer-helper --bin codeg-cli --bin codeg-server \
            --no-default-features --features mcp-bin,computer-helper,cli-bin,server-bin
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries
          for b in codeg-mcp codeg-computer-helper codeg-cli codeg-server; do
            cp "target/debug/$b" "binaries/$b-$triple"
          done
          # macOS 打 .app 时 tauri.macos.conf.json 要 binaries/codeg-computer-helper.app（放进 Contents/Helpers/）：
          # 照 src-tauri/scripts/prepare-sidecars.mjs 的 stageHelperApp 包一层（那个脚本只编 release 版）
          if [[ "$RUNNER_OS" == macOS ]]; then
            helper=binaries/codeg-computer-helper.app
            rm -rf "$helper" && mkdir -p "$helper/Contents/MacOS" "$helper/Contents/Resources"
            ver=$(node -p 'require("./tauri.conf.json").version')
            sed "s/{{version}}/$ver/g" macos/codeg-computer-helper.plist > "$helper/Contents/Info.plist"
            cp target/debug/codeg-computer-helper "$helper/Contents/MacOS/codeg-computer-helper"
            cp icons/icon.icns "$helper/Contents/Resources/icon.icns"
            codesign --force --sign - "$helper"
          fi
          echo "- sidecar：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 桌面主程序（tauri build --debug --features e2e；macOS 打成 .app，Linux 不打包）
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          t0=$(date +%s)
          # macOS 打成 dodoer.app（更新流程测试要一个真的 .app：更新换的是整个包，重开走 LaunchServices）。ad-hoc 签名
          # （jenny 配置里的签名证书运行机上没有），不出 tauri 自己的更新包（要真的签名私钥；测试包由 update/prepare.sh 用测试密钥做）。
          # 打包不改程序本身，target/debug/codeg 照旧给 DOM 那套用。这几个 --config 要放在 jenny 配置后面，不然被它的签名证书盖掉
          bundle=(--no-bundle)
          if [[ "$RUNNER_OS" == macOS ]]; then
            bundle=(--bundles app --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}')
          fi
          # 版本号给一个比哪个正式版都大的（同 desktop-linux.yml）；withGlobalTauri 只在测试版开（@wdio/tauri-plugin 要 window.__TAURI__）
          pnpm tauri build --debug --features e2e \
            --config src-tauri/tauri.jenny.conf.json --config src-tauri/tauri.cowork-desktop.conf.json \
            --config '{"version":"1.999.0","build":{"beforeBuildCommand":""}}' \
            --config '{"app":{"withGlobalTauri":true}}' "${bundle[@]}"
          test -x src-tauri/target/debug/codeg
          if [[ "$RUNNER_OS" == macOS ]]; then
            test -x src-tauri/target/debug/bundle/macos/dodoer.app/Contents/MacOS/codeg-server
            du -sh src-tauri/target/debug/bundle/macos/dodoer.app
          fi
          echo "- 桌面主程序：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 存编好的程序
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/target/debug/codeg
            src-tauri/target/debug/codeg-server
            src-tauri/target/debug/codeg-mcp
            src-tauri/target/debug/codeg-cli
            src-tauri/target/debug/codeg-computer-helper
            src-tauri/target/debug/web
            src-tauri/target/debug/bundle/macos/dodoer.app
            out
          key: ${{ steps.bin.outputs.cache-primary-key }}

      - name: 程序自报（--desktop-edition）
        run: src-tauri/target/debug/codeg --desktop-edition

      # 反过来验发版检查：e2e 测试版必须被它拦下，不然那条检查永远是绿的
      - name: 发版检查认得出 e2e 测试版（应当失败）
        # 程序和前端分开查：一起传的话只要一边认出来（或者少了文件退出 2）就算过，另一边失效了看不出来
        run: |
          set -uo pipefail
          for t in src-tauri/target/debug/codeg src-tauri/target/debug/web; do
            test -e "$t" || { echo "::error::没有 $t"; exit 1; }
            rc=0; bash scripts/check-no-e2e-bits.sh "$t" > /dev/null 2>&1 || rc=$?
            [[ "$rc" == 1 ]] || { echo "::error::check-no-e2e-bits.sh 没认出 e2e 测试版的 $t（退出码 ${rc}）"; exit 1; }
            echo "check-no-e2e-bits.sh 认出了 e2e 测试版的 $t"
          done
          # 更新流程测试的开关（e2e.rs 的 CODEG_E2E_UPDATER_*）也要认得出：改了名字这条检查就失效了
          grep -aq 'CODEG_E2E_UPDATER_ENDPOINTS' src-tauri/target/debug/codeg \
            || { echo "::error::e2e 测试版的程序里没有 CODEG_E2E_UPDATER_ENDPOINTS，check-no-e2e-bits.sh 的 pattern 要跟着改"; exit 1; }
          src-tauri/target/debug/codeg --desktop-edition | grep -q '"e2e":true' \
            || { echo "::error::e2e 测试版的 --desktop-edition 没说 e2e:true（cowork-desktop-build.sh 靠它拦正式包）"; exit 1; }

      - name: WebdriverIO 依赖（npm，不进 pnpm 项目）
        working-directory: scripts/desktop-e2e
        run: npm install --no-package-lock --no-audit --no-fund --loglevel=error

      - name: WebdriverIO：第一次启动 → 退出重开 → 再退出重开
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: |
          set -uo pipefail
          # 数据目录（CODEG_DATA_DIR / CODEG_HOME）每次 run 一个新的，几段共用
          export E2E_DATA_DIR=$(mktemp -d)
          rc=0
          bash scripts/desktop-e2e/run.sh || rc=$?
          # app 自己的日志在数据目录的 logs/ 下
          cp -R "$E2E_DATA_DIR/logs" e2e-out/app-logs 2>/dev/null || true
          exit "$rc"

      # 更新流程（macOS）：update/prepare.sh 用这次现做的测试密钥做 N = 1.999.0、N+1 = 1.999.1 两个测试包，update/run.mjs 起假更新源、
      # 装 N 到 ~/Applications，把发现新版 → 下载 → 重启以更新 → 回退 → 切渠道 → 强杀 → 空闲重启 → 旧纯客户端版升级走一遍。
      # DOM 那套红了也跑。详细输出进 e2e-out/update/（私有 Release），公开日志和 step summary 只有摘要表。
      # 来历：源仓库 .cowork/journal/2026-11-22-e2e-update-feed.md
      - name: 更新流程：测试密钥和两个测试包
        id: update-prep
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          bash scripts/desktop-e2e/update/prepare.sh src-tauri/target/debug/bundle/macos/dodoer.app "$RUNNER_TEMP/e2e-update" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 更新流程：假更新源 + 两个版本
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.update-prep.outcome == 'success' }}
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
          E2E_UPDATE_WORK: ${{ runner.temp }}/e2e-update
        run: |
          set -uo pipefail
          mkdir -p e2e-out/update
          rc=0
          node scripts/desktop-e2e/update/run.mjs > e2e-out/update/run.log 2>&1 || rc=$?
          cat e2e-out/update/summary.md 2>/dev/null || echo "（没有摘要：run.mjs 没跑完，看私有 Release 里的 update/run.log）"
          exit "$rc"

      # 原生层（macOS）：Appium 4 + Mac2 驱动（版本固定）按辅助功能树点菜单栏、托盘、窗口、文件对话框、「重启以更新」弹层、多窗口焦点。
      # 用更新流程同一套测试包（「重启以更新」要先下好一个更新），所以排在它后面。Xcode 是运行机自带的；WebDriverAgentMac 第一次连的时候现编。
      # 来历：源仓库 .cowork/journal/2026-11-22-e2e-native-appium.md
      - name: 原生层：装 Appium 4.0.0 + appium-mac2-driver 5.0.7，起 Appium
        id: appium
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.update-prep.outcome == 'success' }}
        env:
          APPIUM_HOME: ${{ runner.temp }}/appium-home
        run: |
          set -euo pipefail
          t0=$(date +%s)
          npm install --prefix "$RUNNER_TEMP/appium-cli" --no-audit --no-fund --loglevel=error appium@4.0.0
          appium="$RUNNER_TEMP/appium-cli/node_modules/.bin/appium"
          "$appium" driver install --source=npm appium-mac2-driver@5.0.7
          # XCTest 去驱动别的 app 要「自动化模式」，不然每次弹框要密码
          sudo automationmodetool enable-automationmode-without-authentication || true
          sudo DevToolsSecurity -enable || true
          mkdir -p e2e-out/native
          nohup "$appium" --address 127.0.0.1 --port 4723 --log-level info --log e2e-out/native/appium.log > /dev/null 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4723/status > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4723/status > /dev/null
          echo "- Appium 4.0.0 + appium-mac2-driver 5.0.7：$(( $(date +%s) - t0 )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: 原生层：菜单栏、托盘、设置 / 远程窗口、文件对话框、「重启以更新」弹层、多窗口焦点
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.appium.outcome == 'success' }}
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
          E2E_UPDATE_WORK: ${{ runner.temp }}/e2e-update
          APPIUM_HOME: ${{ runner.temp }}/appium-home
        run: |
          set -uo pipefail
          rc=0
          node scripts/desktop-e2e/native/run.mjs > e2e-out/native/run.log 2>&1 || rc=$?
          cat e2e-out/native/summary.md 2>/dev/null || echo "（没有摘要：native/run.mjs 没跑完，看私有 Release 里的 native/run.log）"
          kill "${{ steps.appium.outputs.pid }}" 2>/dev/null || true
          exit "$rc"

      # 留 1 天：desktop-e2e-artifacts.yml 在 run 结束后搬到私有 Release 并删掉这份（搬没成的 1 天后自己过期）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-out-${{ matrix.os }}-attempt${{ github.run_attempt }}
          path: e2e-out
          if-no-files-found: warn
          retention-days: 1

  # 正常编的前端（不带 NEXT_PUBLIC_CODEG_E2E）里不能有 @wdio/tauri-plugin：守卫是编译期的（next.config.ts 的 CODEG_E2E），
  # 这里确认打包器真的把那个 import 丢了。只在每晚 / 手动跑（PR 上不多编一遍前端）；正式包的程序和前端由 cowork-desktop-build.sh 每次发版检查
  prod-frontend:
    name: 正常编的前端不带 WebdriverIO 插件
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: pnpm build（不带 e2e）
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
      - name: check-no-e2e-bits.sh out/
        run: |
          bash scripts/check-no-e2e-bits.sh out
          echo "- 正常编的前端 out/：$(find out -name '*.js' | wc -l) 个 js，没有 WebdriverIO 插件" >> "$GITHUB_STEP_SUMMARY"
