# 编桌面版 dodoer.app（macOS arm64，ad-hoc 签名）并发到本仓库的 Release。用 GitHub 托管的 macOS 机器：公开仓库不收费。
# 源码在私有仓库 Tinghecui/cowork-codeg，用 SOURCE_DEPLOY_KEY（那边的只读 deploy key）拉；本仓库只放这个 workflow 和 Release。
# 编法、冒烟、打包都在源码的 scripts/cowork-desktop-build.sh 里，这里只管拉代码、装工具、发布。
#
# 两种触发：
# - repository_dispatch（build-desktop）：cowork-codeg 推 cowork-codeg-vX.Y.Z tag 时，它的 desktop-macos.yml 发过来，
#   client_payload 带 ref / publish / product_name
# - 手动（Actions → desktop-macos → Run workflow）：编任意分支只放 artifact；ref 填正式版 tag 并勾 publish 可以补发
#
# 公开仓库的日志和 artifact 谁都能看：不要在步骤里打印源码之外的东西（密钥都走 secrets，会被打码）。
# 这里没有 pull_request 触发，fork 来的 PR 拿不到 secrets，也跑不了这个 workflow。
#
# 秘钥：TAURI_SIGNING_PRIVATE_KEY（+ _PASSWORD）签自动更新包，备份在生产机 /root/dodoer-updater/；
# 丢了已经装好的 app 就再也收不到更新。
name: desktop-macos

on:
  repository_dispatch:
    types: [build-desktop]
  workflow_dispatch:
    inputs:
      ref:
        description: "cowork-codeg 要编的分支 / tag / 提交"
        required: false
        default: product/v0.40.0
      product_name:
        description: "界面上的产品名"
        required: false
        default: dodoer
      publish:
        description: "ref 是 cowork-codeg-vX.Y.Z 时发 Release（补发用）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-macos
  cancel-in-progress: false

jobs:
  build:
    name: dodoer.app (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SOURCE_REPO: Tinghecui/cowork-codeg
      REF: ${{ github.event.client_payload.ref || inputs.ref || 'product/v0.40.0' }}
      PUBLISH_INPUT: ${{ github.event.client_payload.publish || inputs.publish || false }}
      NEXT_PUBLIC_PRODUCT_NAME: ${{ github.event.client_payload.product_name || inputs.product_name || 'dodoer' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      # 桌面版本号 = 1.<次>.<修订>，跟着 cowork-codeg 的 tag 走（v0.2.5 → 1.2.5）：自动更新按 semver 比大小，只能往上走
      - id: meta
        name: 版本号、发不发
        run: |
          set -euo pipefail
          tag_re='^cowork-codeg-v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ "$REF" =~ $tag_re ]]; then
            tag="$REF"
            if [[ "$PUBLISH_INPUT" == true ]]; then publish=true; else publish=false; fi
          else
            # 开发版：用最近一个正式版的号，不发
            tag=$(git ls-remote --tags --refs origin 'cowork-codeg-v*' | sed 's#.*refs/tags/##' \
              | grep -E "$tag_re" | sort -V | tail -1)
            publish=false
          fi
          [[ "$tag" =~ $tag_re ]] || { echo "::error::没找到 cowork-codeg-vX.Y.Z（ref=${REF}）"; exit 1; }
          if [[ "${BASH_REMATCH[1]}" != 0 ]]; then
            echo "::error::$tag 的主版本不是 0，桌面版本号规则（1.<次>.<修订>）要重新定"; exit 1
          fi
          version="1.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$tag → dodoer ${version}，publish=$publish"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      # 只缓存依赖和 target 里的第三方 crate；codeg_lib 每次都重编
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-macos

      - name: pnpm（corepack，按 package.json 的 packageManager）
        run: |
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          node --version; pnpm --version; rustc --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-macos-

      - name: 依赖
        run: pnpm install --frozen-lockfile

      # 两种包各自：tauri build → 冒烟 → 打 zip、自动更新包重签（绑定版本号）。完整版先，纯客户端版复用它的前端和 sidecar
      - id: full
        name: 完整版：tauri build、冒烟（codeg-server 子进程）、打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/cowork-desktop-build.sh full

      - id: client
        name: 纯客户端版：tauri build、冒烟（没有 codeg-server、更新线是 client）、打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/cowork-desktop-build.sh client

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.full.outputs.full_name }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      # latest.json（完整版）和 latest-client.json（纯客户端版）各指向这次 Release 里自己那个 .app.tar.gz。
      # 两个 json 在每个 Release 里都放一份，补发旧版本时不会把已经装了新版的人「更新」回去（app 只认更大的号）
      - name: 发 Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NAME: ${{ steps.full.outputs.full_name }}
          UPDATER: ${{ steps.full.outputs.full_updater }}
          CLIENT_NAME: ${{ steps.client.outputs.client_name }}
          CLIENT_UPDATER: ${{ steps.client.outputs.client_updater }}
          CLIENT_ALIAS: ${{ steps.client.outputs.client_alias }}
        run: |
          set -euo pipefail
          rel="v$VERSION"
          git fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" || true
          subject=$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)
          notes="${subject:-$TAG}"
          for pair in "$UPDATER:latest.json" "$CLIENT_UPDATER:latest-client.json"; do
            upd="${pair%%:*}"; out="${pair##*:}"
            jq -n --arg version "$VERSION" --arg notes "$notes" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$(cat "dist/$upd.sig")" \
              --arg url "https://github.com/$RELEASE_REPO/releases/download/$rel/$upd" \
              '{version: $version, notes: $notes, pub_date: $pub_date,
                platforms: {"darwin-aarch64": {signature: $signature, url: $url},
                            "darwin-aarch64-app": {signature: $signature, url: $url}}}' > "dist/$out"
            echo "== $out"; cat "dist/$out"
          done
          body=$(printf '%s\n\n对应 cowork-codeg 的 %s。\n\n两种包，装一种就行：\n\n- **纯客户端版** `%s`（也叫 `%s`）：不带本机 daemon，只连 Cowork 服务器；工作在服务器上的人装这个，门户「桌面版」的下载链接就是它。\n- **完整版** `%s.zip`：自带 codeg-server 做本机 daemon，可以在这台电脑上开本地工作区。\n\n两种包各自更新：已经装了 dodoer 的，app 里会提示更新，点更新、重启就是这一版（装的是哪种就更新成哪种）。\n第一次装：解压后把 dodoer.app 拖进「应用程序」，再在终端执行 `xattr -dr com.apple.quarantine /Applications/dodoer.app`（没有 Apple 开发者签名）。\n' \
            "$notes" "$TAG" "$CLIENT_NAME.zip" "$CLIENT_ALIAS" "$NAME")
          files=("dist/$NAME.zip" "dist/$NAME.zip.sha256" "dist/$UPDATER" "dist/$UPDATER.sig" dist/latest.json
                 "dist/$CLIENT_NAME.zip" "dist/$CLIENT_NAME.zip.sha256" "dist/$CLIENT_ALIAS" "dist/$CLIENT_ALIAS.sha256"
                 "dist/$CLIENT_UPDATER" "dist/$CLIENT_UPDATER.sig" dist/latest-client.json)
          if gh release view "$rel" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$rel" -R "$RELEASE_REPO" --clobber "${files[@]}"
          else
            gh release create "$rel" -R "$RELEASE_REPO" --target main \
              --title "dodoer ${VERSION}（${TAG}）" --notes "$body" "${files[@]}"
          fi
          echo "### dodoer $VERSION 已发布：https://github.com/$RELEASE_REPO/releases/tag/$rel" >> "$GITHUB_STEP_SUMMARY"
