# 公开镜像 Tinghecui/dodoer-releases 的桌面版 dodoer.app（macOS arm64，ad-hoc 签名；文件在私有仓库 cowork-codeg 的
# .github/public/workflows/ 里维护）。跑在 GitHub 托管的 macOS 机器上，公开仓库不收费。
# 编法、冒烟、打包都在 scripts/cowork-desktop-build.sh 里。两种包（完整版、纯客户端版）在两台机器上同时编（matrix），
# 各自编前端、sidecar 和主程序（不共用：纯客户端版换了 feature 和编进二进制的 Tauri 配置，主程序反正要重编），最后 publish 汇总发版。
# 不发版的构建（每晚、macos/pr/<n>、手动不勾 publish）codeg 这个 crate 用 opt-level 1（依赖照旧，缓存和发版共用），快三四成；
# 发版那次是正式的 release 配置。
#
# - tag cowork-codeg-vX.Y.Z 同步过来：编正式版，版本号 1.Y.Z，发到本仓库的 Release v1.Y.Z：两种包各自的安装 zip、
#   自动更新用的 .app.tar.gz + .sig、latest.json 和 latest-client.json。装好的 app 从 releases/latest/download/latest(-client).json 查更新
# - 每晚（北京时间 02:00）编一次 main，两种包都冒烟、不发：PR 上只查配置（test.yml 的 Desktop editions），编出来的包最晚第二天知道。
#   main 的这个提交已经有一次成功的 desktop-macos（前一晚、或者打 tag 发版那次）就跳过
# - 私有 PR 打了 macos-build 标签：public-sync 把它同步到 macos/pr/<n>，这里编、冒烟、不发，结果报回那个 PR（「公开 CI / desktop-macos」）。
#   PR 再推会重编（上一次没编完的取消），去掉标签或关掉 PR 就删 macos/pr/<n>
# - 手动触发（Actions → desktop-macos → Run workflow）：编任意分支只放 artifact；ref 填正式版 tag 并勾 publish 可以补发
#
# 自动更新包用 TAURI_SIGNING_PRIVATE_KEY（+ _PASSWORD）签，签名绑定版本号（requireSignedVersion）。私钥丢了已经装好的 app 就再也收不到更新。
# 公开仓库的日志和 artifact 谁都能看：步骤里别打印代码之外的东西（密钥都走 secrets，会被打码）。
name: desktop-macos

on:
  push:
    tags: ["cowork-codeg-v*"]
    branches: ["macos/pr/**"]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "要编的分支 / tag / 提交"
        required: false
        default: main
      product_name:
        description: "界面上的产品名"
        required: false
        default: dodoer
      publish:
        description: "ref 是 cowork-codeg-vX.Y.Z 时发 Release（补发用）"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# 发版一组、不取消；macos/pr/<n> 每个 PR 一组，新推的取消没编完的；每晚和手动触发按 ref 一组
concurrency:
  group: desktop-macos-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/macos/pr/') }}

jobs:
  # 版本号、发不发、要不要编（每晚的 main 已经成功编过就不编）
  prepare:
    name: 版本号、要不要编
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 桌面版本号 = 1.<次>.<修订>，跟着 cowork-codeg 的 tag 走（v0.2.5 → 1.2.5）：自动更新按 semver 比大小，只能往上走
      - id: meta
        name: 版本号、发不发
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag_re='^cowork-codeg-v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ "$REF" =~ $tag_re ]]; then
            tag="$REF"
            if [[ "$GITHUB_EVENT_NAME" == push || "$PUBLISH_INPUT" == true ]]; then publish=true; else publish=false; fi
          else
            # 开发版：用最近一个正式版的号，不发
            tag=$(git ls-remote --tags --refs origin 'cowork-codeg-v*' | sed 's#.*refs/tags/##' \
              | grep -E "$tag_re" | sort -V | tail -1)
            publish=false
          fi
          [[ "$tag" =~ $tag_re ]] || { echo "::error::没找到 cowork-codeg-vX.Y.Z（ref=${REF}）"; exit 1; }
          if [[ "${BASH_REMATCH[1]}" != 0 ]]; then
            echo "::error::$tag 的主版本不是 0，桌面版本号规则（1.<次>.<修订>）要重新定"; exit 1
          fi
          version="1.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$tag → dodoer ${version}，publish=$publish"

      - id: gate
        name: 要不要编
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            prev=$(gh run list -R "$GITHUB_REPOSITORY" -w desktop-macos.yml -c "$GITHUB_SHA" -s success -L 1 \
              --json databaseId,event -q '.[0] | select(.) | "\(.databaseId)（\(.event)）"')
            if [[ -n "$prev" ]]; then
              build=false
              echo "main 的 ${GITHUB_SHA:0:12} 已经编过：run $prev，今晚不编" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: dodoer.app ${{ matrix.edition }} (macOS arm64)
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [full, client]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PRODUCT_NAME: ${{ inputs.product_name || 'dodoer' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # 两种包的依赖一样，共用一份；只缓存依赖，codeg 每次重编
          shared-key: desktop-macos

      - name: pnpm（corepack，按 package.json 的 packageManager）
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          node --version; pnpm --version; rustc --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-macos-
      - run: pnpm install --frozen-lockfile

      # 只给 codeg 这一个 crate 降级（profile 的 package 覆盖）：依赖的编译指纹不变，rust-cache 恢复的依赖照样能用。
      # 写在 rust-cache 之后：它把 .cargo/config.toml 算进缓存 key，先写就和发版的缓存分家了
      - name: 不发版：codeg 用 opt-level 1
        if: needs.prepare.outputs.publish != 'true'
        run: |
          mkdir -p src-tauri/.cargo
          printf '[profile.release.package.codeg]\nopt-level = 1\n' >> src-tauri/.cargo/config.toml
          cat src-tauri/.cargo/config.toml

      - id: build
        name: tauri build、冒烟、打包（${{ matrix.edition }}）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/cowork-desktop-build.sh ${{ matrix.edition }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs[format('{0}_name', matrix.edition)] }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # latest.json（完整版）和 latest-client.json（纯客户端版）各指向这次 Release 里自己那个 .app.tar.gz。
  # 两个 json 在每个 Release 里都放一份，补发旧版本时不会把已经装了新版的人「更新」回去（app 只认更大的号）。
  # 两种包都编过、冒烟过才发（matrix 任何一边失败这里就不跑）
  publish:
    name: 发 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # 文件名按 cowork-desktop-build.sh 的规则找（两台机器各编一种，文件名不经 job outputs 传）
          one() { local f; f=$(cd dist && ls $1 2>/dev/null) || true
                  [[ $(printf '%s\n' "$f" | grep -c .) == 1 ]] || { echo "::error::dist/ 里 $1 要正好一个，现在：${f:-没有}" >&2; ls -la dist >&2; exit 1; }
                  printf '%s' "$f"; }
          NAME=$(one "dodoer-$VERSION-*-macos-arm64.zip"); NAME="${NAME%.zip}"
          UPDATER=$(one "dodoer-$VERSION-macos-arm64.app.tar.gz")
          CLIENT_NAME=$(one "dodoer-client-$VERSION-*-macos-arm64.zip"); CLIENT_NAME="${CLIENT_NAME%.zip}"
          CLIENT_UPDATER=$(one "dodoer-client-$VERSION-macos-arm64.app.tar.gz")
          CLIENT_ALIAS=$(one "dodoer-client-macos-arm64.zip")
          rel="v$VERSION"
          git fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          subject=$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)
          notes="${subject:-$TAG}"
          for pair in "$UPDATER:latest.json" "$CLIENT_UPDATER:latest-client.json"; do
            upd="${pair%%:*}"; out="${pair##*:}"
            jq -n --arg version "$VERSION" --arg notes "$notes" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$(cat "dist/$upd.sig")" \
              --arg url "https://github.com/$RELEASE_REPO/releases/download/$rel/$upd" \
              '{version: $version, notes: $notes, pub_date: $pub_date,
                platforms: {"darwin-aarch64": {signature: $signature, url: $url},
                            "darwin-aarch64-app": {signature: $signature, url: $url}}}' > "dist/$out"
            echo "== $out"; cat "dist/$out"
          done
          body=$(printf '%s\n\n对应 %s。\n\n两种包，装一种就行：\n\n- **纯客户端版** `%s`（也叫 `%s`）：不带本机 daemon，只连 Cowork 服务器；工作在服务器上的人装这个，门户「桌面版」的下载链接就是它。\n- **完整版** `%s.zip`：自带 codeg-server 做本机 daemon，可以在这台电脑上开本地工作区。\n\n两种包各自更新：已经装了 dodoer 的，app 里会提示更新，点更新、重启就是这一版（装的是哪种就更新成哪种）。\n第一次装：解压后把 dodoer.app 拖进「应用程序」，再在终端执行 `xattr -dr com.apple.quarantine /Applications/dodoer.app`（没有 Apple 开发者签名）。\n' \
            "$notes" "$TAG" "$CLIENT_NAME.zip" "$CLIENT_ALIAS" "$NAME")
          files=("dist/$NAME.zip" "dist/$NAME.zip.sha256" "dist/$UPDATER" "dist/$UPDATER.sig" dist/latest.json
                 "dist/$CLIENT_NAME.zip" "dist/$CLIENT_NAME.zip.sha256" "dist/$CLIENT_ALIAS" "dist/$CLIENT_ALIAS.sha256"
                 "dist/$CLIENT_UPDATER" "dist/$CLIENT_UPDATER.sig" dist/latest-client.json)
          if gh release view "$rel" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$rel" -R "$RELEASE_REPO" --clobber "${files[@]}"
          else
            # --latest：本仓库也放 server 包的 Release，Latest 要明确给桌面版（app 从 releases/latest/download/ 查更新）
            gh release create "$rel" -R "$RELEASE_REPO" --target main --latest \
              --title "dodoer ${VERSION}（${TAG}）" --notes "$body" "${files[@]}"
          fi
          echo "### dodoer $VERSION 已发布：https://github.com/$RELEASE_REPO/releases/tag/$rel" >> "$GITHUB_STEP_SUMMARY"
