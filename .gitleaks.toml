title = "dodoer secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Keyboard notation in a UI comment"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src/lib/computer/stop-shortcut\.ts$''']
regexTarget = "secret"
regexes = ['''^Ctrl\+Alt\+Shift\+Key$''']

[[allowlists]]
description = "Translation key identifier, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src/components/forge/forge-page\.tsx$''']
regexTarget = "secret"
regexes = ['''^WRONG_FORGE_I18N_KEY$''']

[[allowlists]]
description = "Synthetic repository name in a merge test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src-tauri/src/forge/github\.rs$''']
regexTarget = "secret"
regexes = ['''^acme/halfblind$''']

[[allowlists]]
description = "RFC 6455 example WebSocket handshake nonce"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src-tauri/tests/browser_egress\.rs$''']
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Deliberately fake credential used to test redaction"
targetRules = ["stripe-access-token"]
condition = "AND"
paths = ['''src-tauri/src/acp/stderr_tail\.rs$''']
regexes = ['''^sk_live_abcdefghijkl$''']

[[allowlists]]
description = "Literal placeholder in historical local API examples"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''docs/PK-TEST-CASES\.md$''']
regexes = ['''^test-token-123$''']

# dodoer #230 G1-3: fake credentials in the credential-masking tests of
# stderr_tail.rs, with the exact sample strings its tests feed the masking.

[[allowlists]]
description = "Fake curl-auth-header samples in the masking tests of stderr_tail.rs"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^4f9a8b7c6d5e4f3a2b1c$''', '''^dXNlcjpodW50ZXIy$''', '''^figd_AbCdEfGh0123456789ijklmnop$''', '''^xapitoken9999$''']

[[allowlists]]
description = "Fake curl-auth-user samples in the masking tests of stderr_tail.rs"
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^'admin:S3cretPass9'$''', '''^admin:S3cretPass9$''', '''^alice:curluserpw9$''']

[[allowlists]]
description = "Fake generic-api-key samples in the masking tests of stderr_tail.rs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''', '''^693a91f6\-7a2b\-4c3d\-9e8f\-0123456789ab$''', '''^9f2c4e7a1b3d5f60$''', '''^Ab3dEfGh1jKl$''', '''^Ab3dEfGh1jKlMnOp$''', '''^IQoJb3JpZ2luX2VjEJr$''', '''^abc123def456$''', '''^abcd1234efgh$''', '''^dXNlcjpwYXNzd29yZA==$''', '''^glptlegacy1234567890$''', '''^googkey12345678$''', '''^q8Zt3VnRw2LmXc5PbHy7KdJs$''', '''^pypi\-AgEIcHlwaS5vcmcCJGFiY2RlZmdoLWlqa2wtbW5vcC1xcnN0LXV2d3h5ejAxMjM0NQ$''', '''^figd_AbCdEfGh0123456789ijklmnop$''']

[[allowlists]]
description = "Fake gitlab-pat samples in the masking tests of stderr_tail.rs"
targetRules = ["gitlab-pat"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^glpat\-abcdefghij0123456789$''']

[[allowlists]]
description = "Fake pypi-upload-token samples in the masking tests of stderr_tail.rs"
targetRules = ["pypi-upload-token"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^pypi\-AgEIcHlwaS5vcmcCJGFiY2RlZmdoLWlqa2wtbW5vcC1xcnN0LXV2d3h5ejAxMjM0NQ$''']

[[allowlists]]
description = "Fake shopify-access-token samples in the masking tests of stderr_tail.rs"
targetRules = ["shopify-access-token"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^shpat_0123456789abcdef0123456789abcde[f]$''']

[[allowlists]]
description = "Fake slack-app-token samples in the masking tests of stderr_tail.rs"
targetRules = ["slack-app-token"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^xapp\-1\-A0123456789\-0123456789\-abcdef$''']

[[allowlists]]
description = "Fake stripe-access-token samples in the masking tests of stderr_tail.rs"
targetRules = ["stripe-access-token"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^sk_live_51HabcdefGHIJklmnOPQR$''']

[[allowlists]]
description = "Fake private-key blocks in the key-masking tests (redaction code only)"
targetRules = ["private-key"]
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']

[[allowlists]]
description = "Fake relay tokens in the ANTHROPIC_* masking test of stderr_tail.rs (Cowork fork)"
targetRules = ["generic-api-key", "anthropic-api-key"]
condition = "AND"
paths = ['''src\-tauri/src/acp/stderr_tail\.rs$''']
regexTarget = "secret"
regexes = ['''^cr_relaytok0f9e8d7c6b5a4938$''', '''^relaykey0123456789abcdef$''', '''^relayenv0123456789abc$''', '''^sk\-ant\-api03\-AbCdEfGh0123456789xyz$''', '''^cr_relayjson0123456789$''']
