# 公开镜像 Tinghecui/dodoer-releases 的桌面版 dodoer.app（macOS arm64；Intel 包见 desktop-macos-intel.yml。Apple 的 Developer ID 证书签名并公证；文件在私有仓库 cowork-codeg 的
# .github/public/workflows/ 里维护）。跑在 GitHub 托管的 macOS 机器上，公开仓库不收费。
# 编法、冒烟、打包都在 scripts/cowork-desktop-build.sh 里。只有一种包（完整版，自带 codeg-server；2026-11-09 去掉了纯客户端版），
# 一台机器编前端、sidecar 和主程序，最后 publish 发版。
#
# - tag cowork-codeg-vX.Y.Z 同步过来：编正式版，版本号 1.Y.Z，发到本仓库的 Release v1.Y.Z：安装 zip（带版本号的一份，
#   加上不带版本号的 dodoer-macos-arm64.zip 和门户下载链接用的 dodoer-client-macos-arm64.zip，内容一样；Intel 的是 *-macos-x64.zip，
#   没有 client 那个别名，每天北京时间 5 点由 desktop-macos-intel.yml 单独编、挂到当时最新的 Release 上）、
#   自动更新用的 .app.tar.gz + .sig、latest.json 和 latest-client.json（darwin-aarch64，两个都指这个包：装过纯客户端版的 app 从
#   latest-client.json 查更新，这样就更新成完整版），以及原样带上的上一版 latest-x64.json（Intel 的 app 查它）。
#   装好的 app 从 releases/latest/download/latest(-client|-x64).json 查更新
# - 每晚（北京时间 02:37）编一次 main，冒烟、不发：PR 上只查配置（test.yml 的 Desktop editions），编出来的包最晚第二天知道。
#   main 的这个提交已经有一次成功的 desktop-macos（前一晚、或者打 tag 发版那次）就跳过
# - 私有 PR 打了 macos-build 标签：public-sync 把它同步到 macos/pr/<n>，这里编、冒烟、不发，结果报回那个 PR（「公开 CI / desktop-macos」）。
#   PR 再推会重编（上一次没编完的取消），去掉标签或关掉 PR 就删 macos/pr/<n>
# - 手动触发（Actions → desktop-macos → Run workflow）：编任意分支只放 artifact；ref 填正式版 tag 并勾 publish 可以补发
# - release-train.yml 调它（workflow_call，train 为真）：product 每合一次就编触发的那个提交、发下一个修订版。tag 它一开始就建在
#   这个提交上了，Release 挂到已有的 tag 上；发之前等这个提交的 Test 过（scripts/cowork-wait-test.sh），说明用调用方给的改动清单
#
# 自动更新包用 TAURI_SIGNING_PRIVATE_KEY（+ _PASSWORD）签，签名绑定版本号（requireSignedVersion）。私钥丢了已经装好的 app 就再也收不到更新。
# app 本身用 DODOER_DEVID_P12（+ _PASSWORD）里 Apple 发的 Developer ID Application 证书签，再用 APPLE_ID / APPLE_PASSWORD（App 专用密码）/
# APPLE_TEAM_ID 交给 Apple 公证（scripts/cowork-desktop-build.sh 里做）：别人下载后不弹「无法验证开发者」；macOS 的屏幕录制、辅助功能
# 授权记的是签名的 Team ID，更新以后还在。ad-hoc 签名记的是每一版自己的哈希，每更新一次就悄悄失效一次（开关还亮着）。
# 没配 DODOER_DEVID_P12 时退回以前那张自签名证书 DODOER_CODESIGN_P12（不公证）。证书和私钥的备份在生产机 /root/dodoer-codesign/
# （只有 root 能读）；证书到期或丢了，在同一个开发者账户下换一张，授权不受影响。
# 公开仓库的日志和 artifact 谁都能看：步骤里别打印代码之外的东西（密钥都走 secrets，会被打码）。
#
# 黑苹果（2026-11-16 起）：用户家里的黑苹果（Intel i7-12700KF 20 线程 / 64GB）挂成自托管 runner（标签 hackintosh），在线就在它上面
# 交叉编 arm64（build-hack，target 目录留在机器上，增量编），再交给 GitHub 的 macos-15 只做冒烟（smoke，几分钟）；实测编译
# 从托管机器上的 ~56 分钟降到十几分钟。在不在线看 hackintosh-heartbeat.yml 最近一次成功的时间（45 分钟内算在线）；过期了
# 先现派一次心跳、最多等 5 分钟，还没回来才算不在线。仓库变量 HACKINTOSH_BUILD=off 强制不用它，=force 不看心跳直接用（试流程用）。
# 什么时候切到 macos-15（build）：只有机器的问题才切——黑苹果不在线；build-hack 在编译之前的步骤挂了（装依赖、钥匙串）、
# 机器掉线、超时。编译 / 打包那一步挂了（在黑苹果上已经重试过一次）或者冒烟没过，多半是代码的问题，macos-15 编同样的代码
# 也过不了，就让这次 run 红着，去看日志修代码；确实是黑苹果自己的问题，设 HACKINTOSH_BUILD=off 重跑。
# 判定在线之后它又掉线、活一直排着 → watchdog 15 分钟后取消这次 run（自动发版的号由 release-train 的 untag 退回）。
name: desktop-macos

on:
  push:
    tags: ["cowork-codeg-v*"]
    branches: ["macos/pr/**"]
  schedule:
    # 不放整点：GitHub 整点的定时任务最挤，会晚很久或者干脆丢掉（2026-11-07 第一晚 18:00 的那次就没跑）
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "要编的分支 / tag / 提交"
        required: false
        default: main
      product_name:
        description: "界面上的产品名"
        required: false
        default: dodoer
      publish:
        description: "ref 是 cowork-codeg-vX.Y.Z 时发 Release（补发用）"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      tag:
        description: "要发的 cowork-codeg-vX.Y.Z（release-train 已经把它和 v1.Y.Z 建在调用方触发的那个提交上）；编的就是那个提交"
        type: string
        required: true
      notes:
        description: "Release 说明里的改动清单（markdown），也是 latest.json 的 notes"
        type: string
        required: false
        default: ""
      train:
        description: "自动发版：发之前等这个提交的 Test 过"
        type: boolean
        required: false
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      DODOER_CODESIGN_P12:
        required: true
      DODOER_CODESIGN_PASSWORD:
        required: true
      # Apple 的 Developer ID 证书和公证用的账户；都配了就用它签名并公证，没配还是上面那张自签名证书
      DODOER_DEVID_P12:
        required: false
      DODOER_DEVID_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      # 发版的包编进 Sentry 的 DSN（见下面 build 那步）；不传就是关的
      CODEG_TELEMETRY_BUILTIN_DSN:
        required: false
      CODEG_TELEMETRY_BUILTIN_WEB_DSN:
        required: false

permissions:
  contents: read

# 发版一组、不取消；自动发版单独一组（release-train.yml 自己一次只跑一班），别和每晚的 main 排在一组里被顶掉；
# macos/pr/<n> 每个 PR 一组，新推的取消没编完的；每晚和手动触发按 ref 一组
concurrency:
  group: desktop-macos-${{ inputs.train && 'train' || (startsWith(github.ref, 'refs/tags/') && 'release' || github.ref) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/macos/pr/') }}

jobs:
  # 版本号、发不发、要不要编（每晚的 main 已经成功编过就不编）
  prepare:
    name: 版本号、要不要编
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write # 心跳过期时派一次 hackintosh-heartbeat 再等它
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      build: ${{ steps.gate.outputs.build }}
      hack: ${{ steps.hack.outputs.hack }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 分支推送按提交 sha 取：macos/pr/<n> 在 PR 合并、关闭时就删了，比这里跑完早（同 cowork-release.yml）
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}

      # 桌面版本号 = 1.<次>.<修订>，跟着 cowork-codeg 的 tag 走（v0.2.5 → 1.2.5）：自动更新按 semver 比大小，只能往上走
      - id: meta
        name: 版本号、发不发
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^cowork-codeg-v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ -n "$TAG_INPUT" ]]; then
            # release-train.yml：要发的号由它定，cowork-codeg-vX.Y.Z 和 v1.Y.Z 两个 tag 它先建好了
            tag="$TAG_INPUT"; publish=true
          elif [[ "$REF" =~ $tag_re ]]; then
            tag="$REF"
            if [[ "$GITHUB_EVENT_NAME" == push || "$PUBLISH_INPUT" == true ]]; then publish=true; else publish=false; fi
          else
            # 开发版：用最近一个正式版的号，不发
            tag=$(git ls-remote --tags --refs origin 'cowork-codeg-v*' | sed 's#.*refs/tags/##' \
              | grep -E "$tag_re" | sort -V | tail -1)
            publish=false
          fi
          [[ "$tag" =~ $tag_re ]] || { echo "::error::没找到 cowork-codeg-vX.Y.Z（ref=${REF}）"; exit 1; }
          if [[ "${BASH_REMATCH[1]}" != 0 ]]; then
            echo "::error::$tag 的主版本不是 0，桌面版本号规则（1.<次>.<修订>）要重新定"; exit 1
          fi
          version="1.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$tag → dodoer ${version}，publish=$publish"

      - id: gate
        name: 要不要编
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # 自动发版那次编的桌面包算在 release-train 的 run 里
            prev=""
            for wf in desktop-macos.yml release-train.yml; do
              [[ -n "$prev" ]] || prev=$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf" -c "$GITHUB_SHA" -s success -L 1 \
                --json databaseId,event -q '.[0] | select(.) | "\(.databaseId)（\(.event)）"' || true)
            done
            if [[ -n "$prev" ]]; then
              build=false
              echo "main 的 ${GITHUB_SHA:0:12} 已经编过：run ${prev}，今晚不编" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # 黑苹果在不在线：hackintosh-heartbeat.yml 每 10 分钟在它上面跑一次，最近一次成功在 45 分钟内就算在线
      - id: hack
        name: 黑苹果在不在线
        env:
          GH_TOKEN: ${{ github.token }}
          HACK_SWITCH: ${{ vars.HACKINTOSH_BUILD }}
        run: |
          set -euo pipefail
          hack=false
          if [[ "${HACK_SWITCH:-on}" == off ]]; then
            echo "仓库变量 HACKINTOSH_BUILD=off：不用黑苹果"
          elif [[ "$HACK_SWITCH" == force ]]; then
            hack=true
            echo "仓库变量 HACKINTOSH_BUILD=force：不看心跳，直接用黑苹果（试新流程用，用完删掉变量）"
          else
            last_ok() {
              gh run list -R "$GITHUB_REPOSITORY" -w hackintosh-heartbeat.yml -s success -L 1 \
                --json updatedAt -q '.[0].updatedAt // empty' 2>/dev/null || true
            }
            last=$(last_ok)
            if [[ -n "$last" ]] && (( $(date +%s) - $(date -d "$last" +%s) < 2700 )); then
              hack=true
              echo "黑苹果最近一次心跳：$last，在线"
            else
              # 心跳过期不马上切 GitHub：现派一次心跳，最多等 5 分钟（机器刚重启、网络刚恢复、几个 runner 都忙）
              echo "黑苹果最近一次心跳：${last:-没有}，过期了；派一次心跳，最多等 5 分钟"
              t0=$(date +%s)
              gh workflow run hackintosh-heartbeat.yml -R "$GITHUB_REPOSITORY" \
                --ref "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" || echo "::warning::派心跳失败"
              while (( $(date +%s) - t0 < 300 )); do
                sleep 15
                last=$(last_ok)
                if [[ -n "$last" ]] && (( $(date -d "$last" +%s) >= t0 )); then
                  hack=true
                  break
                fi
              done
              echo "等了 $(( $(date +%s) - t0 )) 秒：hack=$hack（最近一次心跳 ${last:-没有}）"
            fi
          fi
          echo "hack=$hack" >> "$GITHUB_OUTPUT"

  # 黑苹果上交叉编 arm64：不跑包里的程序（Intel 上跑不了），冒烟交给下面的 smoke
  build-hack:
    name: dodoer.app (macOS arm64，黑苹果交叉编译)
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.hack == 'true'
    runs-on: [self-hosted, hackintosh]
    # 编译约 20 分钟（失败重试一次再 20），等网络、上传最多再几十分钟
    timeout-minutes: 110
    outputs:
      # 编译 / 打包这一步自己失败了（重试过一次）：多半是代码的问题，GitHub 上编同样的代码也过不了，不切过去
      build_failed: ${{ steps.build.outcome == 'failure' }}
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PRODUCT_NAME: ${{ inputs.product_name || 'dodoer' }}
      NODE_OPTIONS: --max-old-space-size=8192
      DODOER_TARGET: aarch64-apple-darwin
      DODOER_SKIP_SMOKE: "1"
    steps:
      # 开工前网络正好断着（切网、重启小火箭），拉代码就失败、转到 GitHub 上编；先等它恢复
      - name: 等网络通
        timeout-minutes: 12
        continue-on-error: true
        # 每 15 秒试一次能不能连上 GitHub（runner 的 .env 里配了小火箭的代理，curl 跟着走），连续 2 次通了才往下，
        # 最多等 10 分钟；等不到也往下走，让后面的步骤自己失败
        run: |
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -m 10 https://api.github.com/zen; then
              ok=$((ok + 1))
              if [[ $ok -ge 2 ]]; then echo "网络通了（第 ${i} 次检查）"; exit 0; fi
            else
              ok=0; echo "连不上 GitHub，15 秒后再试（第 ${i} 次）"
            fi
            sleep 15
          done
          echo "::warning::等了 10 分钟网络还没恢复"
      # clean: false：留着 src-tauri/target 和 node_modules 做增量（自托管不用 rust-cache，见 COWORK.md）
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}
          clean: false
      - name: 工具链（机器上装好的 rustup / node / pnpm）
        run: |
          # Rust 版本读 rust-toolchain.toml（和托管机器一样）；老的提交没有这个文件就用机器上的默认版本
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          if [[ -n "$channel" ]]; then
            rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt --no-self-update
          fi
          rustup target add aarch64-apple-darwin
          node --version; pnpm --version; rustc --version
      - run: pnpm install --frozen-lockfile
      - name: 签名证书（临时钥匙串）
        env:
          P12: ${{ secrets.DODOER_DEVID_P12 || secrets.DODOER_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.DODOER_DEVID_P12 && secrets.DODOER_DEVID_PASSWORD || secrets.DODOER_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12" || -z "$P12_PASSWORD" ]]; then
            echo "::error::缺 Secret DODOER_DEVID_P12 / DODOER_DEVID_PASSWORD：不签名的包装上以后屏幕录制等授权会失效"
            exit 1
          fi
          kc="$RUNNER_TEMP/dodoer-codesign.keychain-db"
          kc_pw=$(openssl rand -hex 16)
          echo "::add-mask::$kc_pw"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          lockf -k -t 60 /tmp/dodoer-keychain-list.lock security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/codesign.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          # p12 里带的中间证书（Developer ID G2）单独再导一次，再列出钥匙串里的证书：codesign 在钥匙串里找不到中间证书
          # 就拼不出证书链（unable to build chain to self-signed root + errSecInternalComponent，2026-11-18 第一次用新证书时遇到）
          ca="$RUNNER_TEMP/codesign-ca.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/codesign.p12" -passin env:P12_PASSWORD -nokeys -cacerts -out "$ca" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/codesign.p12" -passin env:P12_PASSWORD -nokeys -cacerts -out "$ca" 2>/dev/null || true
          if grep -q "BEGIN CERTIFICATE" "$ca" 2>/dev/null; then
            security import "$ca" -k "$kc" -t cert >/dev/null 2>&1 || true
          fi
          rm -f "$ca"
          security find-certificate -a "$kc" | grep '"labl"' || true
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          echo "DODOER_KEYCHAIN_PASSWORD=$kc_pw" >> "$GITHUB_ENV"
          # Apple 发的 Developer ID 证书；Secret 还没换时是以前那张自签名的
          sha1=""
          for cn in "Developer ID Application" "dodoer code signing"; do
            sha1=$(security find-certificate -c "$cn" -Z "$kc" 2>/dev/null | awk '/SHA-1 hash:/ {print $3}') || true
            if [[ -n "$sha1" ]]; then break; fi
          done
          if [[ ! "$sha1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::临时钥匙串里没有签名证书（Developer ID Application 或 dodoer code signing）"
            exit 1
          fi
          echo "DODOER_SIGNING_IDENTITY=$sha1" >> "$GITHUB_ENV"
          echo "DODOER_SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      # runner 是 LaunchDaemon，plist 里必须有 SessionCreate=true：不然进程在系统的安全会话里，实际的搜索列表
      # 只有 System.keychain，user 域的列表设了也不管用，codesign 报 no identity found（2026-11-16 踩过）。
      # 编译前再解锁一次、把搜索列表重设成「临时钥匙串 + 还在的其他钥匙串」（每个 job 都会留一条旧路径），
      # 再按全局搜索确认找得到这个身份，找不到就在这里失败（几十秒），不用等编完 15 分钟才在签名时失败
      - name: 钥匙串再检查一次
        run: |
          set -euo pipefail
          security unlock-keychain -p "$DODOER_KEYCHAIN_PASSWORD" "$DODOER_SIGNING_KEYCHAIN"
          # 这台机器上有几个 runner，同一个用户、同一份搜索列表：读改写要加锁，别的 runner 正在用的钥匙串
          # （文件还在）要留着，只去掉已经删掉的和自己的重复项
          # shellcheck disable=SC2016
          lockf -k -t 60 /tmp/dodoer-keychain-list.lock bash -c '
            keep=()
            while IFS= read -r k; do
              k=$(echo "$k" | tr -d "\" ")
              [[ -f "$k" && "$k" != "$1" ]] && keep+=("$k")
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$1" ${keep[@]+"${keep[@]}"}
          ' _ "$DODOER_SIGNING_KEYCHAIN"
          security list-keychains -d user
          security show-keychain-info "$DODOER_SIGNING_KEYCHAIN"
          security find-identity -p codesigning "$DODOER_SIGNING_KEYCHAIN"
          security find-identity -p codesigning | grep -q "$DODOER_SIGNING_IDENTITY" || {
            echo "::error::搜索列表里找不到签名身份 $DODOER_SIGNING_IDENTITY"
            exit 1
          }
      - id: build
        name: tauri build（交叉编译）、打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 公证（证书是 Developer ID 时 scripts/cowork-desktop-build.sh 用）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 和下面 build 一样：要发布的包编进 Sentry 的 DSN（2026-11-16 以前这里漏了，黑苹果编的 v1.6.27、v1.6.28 本机工作区不上报）
          CODEG_TELEMETRY_BUILTIN_DSN: ${{ needs.prepare.outputs.publish == 'true' && secrets.CODEG_TELEMETRY_BUILTIN_DSN || '' }}
          CODEG_TELEMETRY_BUILTIN_WEB_DSN: ${{ needs.prepare.outputs.publish == 'true' && secrets.CODEG_TELEMETRY_BUILTIN_WEB_DSN || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # 第一次失败在本机重试一次（下载依赖走代理，偶尔断）：代码错了重试也是增量编译，一两分钟就再失败。
        # 两次都套着 scripts/stall-watchdog.sh：20 分钟一行输出都没有就当卡死、停掉（2026-11-17 next build 空等了 110 分钟，
        # .cowork/journal/2026-11-17-hackintosh-stall-watchdog.md；正常编译最长一段没输出约 8 分钟）
        run: |
          rc=0
          scripts/stall-watchdog.sh 20 -- scripts/cowork-desktop-build.sh full || rc=$?
          if [[ $rc == 0 ]]; then exit 0; fi
          if [[ $rc == 124 ]]; then
            # 卡死过一次的 Turbopack 缓存不留着：清掉再编（前端多编两三分钟）
            echo "::warning::黑苹果上编译 20 分钟没有输出，当它卡死了：清掉 Turbopack 的缓存，重编一次"
            rm -rf .next/cache/turbopack
          else
            echo "::warning::黑苹果上第一次编译失败，重试一次"
          fi
          # 失败多半是下载依赖时断了网：先等网络恢复（最多 10 分钟）再重试，不然重试也失败，会被当成代码的问题
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -m 10 https://api.github.com/zen; then
              ok=$((ok + 1)); if [[ $ok -ge 2 ]]; then break; fi
            else
              ok=0; echo "连不上 GitHub，15 秒后再试（第 ${i} 次）"
            fi
            sleep 15
          done
          scripts/stall-watchdog.sh 20 -- scripts/cowork-desktop-build.sh full
      # 自托管机器上钥匙串不会随机器销毁，搜索列表也要还原
      - name: 删掉临时钥匙串
        if: always()
        run: |
          if [[ -n "${DODOER_SIGNING_KEYCHAIN:-}" ]]; then
            lockf -k -t 60 /tmp/dodoer-keychain-list.lock security delete-keychain "$DODOER_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/codesign.p12"
      # 上传最容易被网络打断：经小火箭的本机代理连 GitHub，连接断了可能不报错、一直干等（2026-11-16 卡过 10 分钟），
      # 切网、重启小火箭时连接被重置（2026-11-16 因此三次转到 GitHub 上编，一等一小时）。每次最多 15 分钟，
      # 没传完就先等网络恢复（最多 10 分钟）再传，一共 3 次（overwrite），都不行这个 job 才失败
      - id: upload
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        continue-on-error: true
        with:
          name: dodoer-hack-dist
          path: |
            dist/
            !dist/dodoer-macos-*.zip*
            !dist/dodoer-client-macos-*.zip*
          retention-days: 7
          if-no-files-found: error
      - name: 上传没成：等网络恢复
        if: steps.upload.outcome != 'success'
        timeout-minutes: 12
        continue-on-error: true
        # 每 15 秒试一次能不能连上 GitHub（runner 的 .env 里配了小火箭的代理，curl 跟着走），连续 2 次通了才往下，
        # 最多等 10 分钟；等不到也往下走，让后面的步骤自己失败
        run: |
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -m 10 https://api.github.com/zen; then
              ok=$((ok + 1))
              if [[ $ok -ge 2 ]]; then echo "网络通了（第 ${i} 次检查）"; exit 0; fi
            else
              ok=0; echo "连不上 GitHub，15 秒后再试（第 ${i} 次）"
            fi
            sleep 15
          done
          echo "::warning::等了 10 分钟网络还没恢复"
      - id: upload2
        if: steps.upload.outcome != 'success'
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        continue-on-error: true
        with:
          name: dodoer-hack-dist
          overwrite: true
          path: |
            dist/
            !dist/dodoer-macos-*.zip*
            !dist/dodoer-client-macos-*.zip*
          retention-days: 7
          if-no-files-found: error
      - name: 又没成：再等网络恢复
        if: steps.upload.outcome != 'success' && steps.upload2.outcome != 'success'
        timeout-minutes: 12
        continue-on-error: true
        # 每 15 秒试一次能不能连上 GitHub（runner 的 .env 里配了小火箭的代理，curl 跟着走），连续 2 次通了才往下，
        # 最多等 10 分钟；等不到也往下走，让后面的步骤自己失败
        run: |
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -m 10 https://api.github.com/zen; then
              ok=$((ok + 1))
              if [[ $ok -ge 2 ]]; then echo "网络通了（第 ${i} 次检查）"; exit 0; fi
            else
              ok=0; echo "连不上 GitHub，15 秒后再试（第 ${i} 次）"
            fi
            sleep 15
          done
          echo "::warning::等了 10 分钟网络还没恢复"
      - id: upload3
        if: steps.upload.outcome != 'success' && steps.upload2.outcome != 'success'
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        with:
          name: dodoer-hack-dist
          overwrite: true
          path: |
            dist/
            !dist/dodoer-macos-*.zip*
            !dist/dodoer-client-macos-*.zip*
          retention-days: 7
          if-no-files-found: error

  # 黑苹果编的包在 arm64 机器上冒烟（同一个脚本的 smoke 模式）
  smoke:
    name: 冒烟（macos-15，黑苹果编的包）
    needs: [prepare, build-hack]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dodoer-hack-dist
          path: dist
      - name: 冒烟
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/cowork-desktop-build.sh smoke

  # 判定黑苹果在线之后它又掉线：build-hack 一直排着，build 和 publish 都在等它。15 分钟还没开始就取消这次 run
  watchdog:
    name: 黑苹果接没接活
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.hack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              -q '[.jobs[] | select(.name | test("黑苹果交叉编译")) | select(.status == "queued" or .status == "waiting" or .status == "pending")] | length')
            if [[ "$st" == 0 ]]; then
              echo "黑苹果的活都接了"; exit 0
            fi
            sleep 30
          done
          echo "::error::黑苹果 15 分钟没接完活（判定在线以后掉线了，或者几个 runner 一直被占着），取消这次 run；下一次心跳过期以后就走 macos-15" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          exit 1

  # 托管机器上编：黑苹果不在线时直接编；黑苹果编挂了或冒烟没过时兜底重编
  build:
    name: dodoer.app (macOS arm64)
    needs: [prepare, build-hack, smoke]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' &&
      (needs.prepare.outputs.hack != 'true' ||
       (needs.build-hack.result != 'success' && needs.build-hack.outputs.build_failed != 'true'))
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.build.outputs.full_name }}
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_PRODUCT_NAME: ${{ inputs.product_name || 'dodoer' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.ref_type == 'branch' && github.sha) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust 版本（读 rust-toolchain.toml）
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml 2>/dev/null || true)
          [[ -n "$channel" ]] || { channel=stable; echo "::warning::没读到 rust-toolchain.toml 的 channel（这个提交还没有这个文件？），用 stable"; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # 只缓存依赖，codeg 每次重编
          shared-key: desktop-macos

      - name: pnpm（corepack，按 package.json 的 packageManager）
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          node --version; pnpm --version; rustc --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-macos-
      - run: pnpm install --frozen-lockfile

      # 证书导进一个临时钥匙串，加进搜索列表让 codesign 找得到；身份用证书的 SHA-1 指定（自签名证书不受信任，
      # find-identity -v 列不出它，按名字找不稳，codesign 按哈希找不看信任）
      - name: 签名证书（临时钥匙串）
        env:
          P12: ${{ secrets.DODOER_DEVID_P12 || secrets.DODOER_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.DODOER_DEVID_P12 && secrets.DODOER_DEVID_PASSWORD || secrets.DODOER_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12" || -z "$P12_PASSWORD" ]]; then
            echo "::error::缺 Secret DODOER_DEVID_P12 / DODOER_DEVID_PASSWORD：不签名的包装上以后屏幕录制等授权会失效"
            exit 1
          fi
          kc="$RUNNER_TEMP/dodoer-codesign.keychain-db"
          kc_pw=$(openssl rand -hex 16)
          echo "::add-mask::$kc_pw"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/codesign.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          # p12 里带的中间证书（Developer ID G2）单独再导一次，再列出钥匙串里的证书：codesign 在钥匙串里找不到中间证书
          # 就拼不出证书链（unable to build chain to self-signed root + errSecInternalComponent，2026-11-18 第一次用新证书时遇到）
          ca="$RUNNER_TEMP/codesign-ca.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/codesign.p12" -passin env:P12_PASSWORD -nokeys -cacerts -out "$ca" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/codesign.p12" -passin env:P12_PASSWORD -nokeys -cacerts -out "$ca" 2>/dev/null || true
          if grep -q "BEGIN CERTIFICATE" "$ca" 2>/dev/null; then
            security import "$ca" -k "$kc" -t cert >/dev/null 2>&1 || true
          fi
          rm -f "$ca"
          security find-certificate -a "$kc" | grep '"labl"' || true
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Apple 发的 Developer ID 证书；Secret 还没换时是以前那张自签名的
          sha1=""
          for cn in "Developer ID Application" "dodoer code signing"; do
            sha1=$(security find-certificate -c "$cn" -Z "$kc" 2>/dev/null | awk '/SHA-1 hash:/ {print $3}') || true
            if [[ -n "$sha1" ]]; then break; fi
          done
          if [[ ! "$sha1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::临时钥匙串里没有签名证书（Developer ID Application 或 dodoer code signing）"
            exit 1
          fi
          security find-identity -p codesigning "$kc"
          echo "DODOER_SIGNING_IDENTITY=$sha1" >> "$GITHUB_ENV"
          echo "DODOER_SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      # 要发布的包把 Sentry 的 DSN 编进 app 自带的 codeg-server（prepare-sidecars 编它，继承这里的环境；
      # src-tauri/src/telemetry/config.rs，docs/telemetry.md §5.1、§5.11），本机工作区默认上报。每晚、macos/pr/<n>、
      # 手动只编不发的不给，和本地编的一样是关的。冒烟（--local-daemon-smoke）起的 daemon 自己关着遥测
      - id: build
        name: tauri build、冒烟、打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 公证（证书是 Developer ID 时 scripts/cowork-desktop-build.sh 用）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEG_TELEMETRY_BUILTIN_DSN: ${{ needs.prepare.outputs.publish == 'true' && secrets.CODEG_TELEMETRY_BUILTIN_DSN || '' }}
          CODEG_TELEMETRY_BUILTIN_WEB_DSN: ${{ needs.prepare.outputs.publish == 'true' && secrets.CODEG_TELEMETRY_BUILTIN_WEB_DSN || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/cowork-desktop-build.sh full

      - name: 删掉临时钥匙串
        if: always()
        run: |
          if [[ -n "${DODOER_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DODOER_SIGNING_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.full_name }}
          # 不传别名副本（同一个安装包换个名字，arm64 两份、Intel 一份，每份一百多 MB）：黑苹果上传只有几百 KB/s，
          # 一次多传 140–280 MB 要多等十几分钟（2026-11-16）。publish 从带版本号的那份复制出来
          path: |
            dist/
            !dist/dodoer-macos-*.zip*
            !dist/dodoer-client-macos-*.zip*
          retention-days: 7
          if-no-files-found: error

  # latest.json 和 latest-client.json 内容一样，都指向这次 Release 的 .app.tar.gz：装过纯客户端版（1.3.0 起有过）的 app
  # 从 latest-client.json 查更新，同一把签名私钥、同一个 identifier（app.codeg）、同一个数据目录，所以它就地更新成完整版。
  # 两个 json 在每个 Release 里都放一份，补发旧版本时不会把已经装了新版的人「更新」回去（app 只认更大的号）。
  # 编过、冒烟过才发
  publish:
    name: 发 Release
    needs: [prepare, build, build-hack, smoke]
    # 托管机器编的（build 成功），或者黑苹果编的、冒烟过了（build 没跑）
    if: >-
      !cancelled() && needs.prepare.outputs.publish == 'true' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.smoke.result == 'success'))
    runs-on: ubuntu-latest
    # 自动发版要在这里等 Test（一般早就跑完了，最多等 60 分钟）
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write # scripts/cowork-wait-test.sh 查 Test、没过时重跑一次
    steps:
      - uses: actions/checkout@v4
        with:
          # 自动发版按提交取（tag 也建在这个提交上）
          ref: ${{ inputs.train && github.sha || needs.prepare.outputs.tag }}
      - id: gate
        name: 等这个提交的 Test 过（自动发版）
        if: inputs.train
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cowork-wait-test.sh "$GITHUB_SHA"
      # 只取一份：build 成功了取它的，不然取黑苹果的（两份同名文件混在一起，.sig 会对不上）
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.train || steps.gate.outputs.ok == 'true' }}
        with:
          name: ${{ needs.build.result == 'success' && needs.build.outputs.artifact || 'dodoer-hack-dist' }}
          path: dist
      - name: 发 Release
        if: ${{ !inputs.train || steps.gate.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES_INPUT: ${{ inputs.notes }}
          TRAIN: ${{ inputs.train }}
        run: |
          set -euo pipefail
          # 文件名按 cowork-desktop-build.sh 的规则找（不经 job outputs 传）
          one() { local f; f=$(cd dist && ls $1 2>/dev/null) || true
                  [[ $(printf '%s\n' "$f" | grep -c .) == 1 ]] || { echo "::error::dist/ 里 $1 要正好一个，现在：${f:-没有}" >&2; ls -la dist >&2; exit 1; }
                  printf '%s' "$f"; }
          NAME=$(one "dodoer-$VERSION-*-macos-arm64.zip"); NAME="${NAME%.zip}"
          UPDATER=$(one "dodoer-$VERSION-macos-arm64.app.tar.gz")
          # 别名副本 artifact 里没有（见上面 upload-artifact），在这里复制；.sha256 和构建脚本一样只写文件名
          ALIAS=dodoer-macos-arm64.zip CLIENT_ALIAS=dodoer-client-macos-arm64.zip
          for a in "$ALIAS" "$CLIENT_ALIAS"; do
            cp "dist/$NAME.zip" "dist/$a"
            (cd dist && shasum -a 256 "$a" > "$a.sha256")
          done
          # Intel 包每天单独编、挂到当时最新的 Release 上（desktop-macos-intel.yml），自动更新查 latest-x64.json。
          # Intel 的 app 查的是 releases/latest/download/latest-x64.json，所以每一版都要带一份：原样带上上一个 Release 里的
          X64_MANIFEST=""
          if gh release download -R "$RELEASE_REPO" -p latest-x64.json -D "$RUNNER_TEMP/x64" 2>/dev/null; then
            cp "$RUNNER_TEMP/x64/latest-x64.json" dist/latest-x64.json && X64_MANIFEST=dist/latest-x64.json
            echo "带上上一版的 latest-x64.json：$(jq -c '{version, url: .platforms["darwin-x86_64"].url}' dist/latest-x64.json)"
          else
            echo "::notice::上一个 Release 里没有 latest-x64.json（还没发过 Intel 包）"
          fi
          rel="v$VERSION"
          if [[ -n "$NOTES_INPUT" ]]; then
            notes="$NOTES_INPUT"
          else
            git fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            subject=$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)
            notes="${subject:-$TAG}"
          fi
          for out in latest.json latest-client.json; do
            jq -n --arg version "$VERSION" --arg notes "$notes" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$(cat "dist/$UPDATER.sig")" \
              --arg url "https://github.com/$RELEASE_REPO/releases/download/$rel/$UPDATER" \
              '{version: $version, notes: $notes, pub_date: $pub_date,
                platforms: {"darwin-aarch64": {signature: $signature, url: $url},
                            "darwin-aarch64-app": {signature: $signature, url: $url}}}' > "dist/$out"
            echo "== $out"; cat "dist/$out"
          done
          body=$(printf '%s\n\n对应 %s。\n\n安装包 `%s.zip`（也叫 `%s`；`%s` 是同一个文件，给门户的下载链接用）。打开后在开始页选「在这台电脑上工作」或者一台服务器，本机和服务器上的工作区可以同时开着。\n\n已经装了 dodoer 的（包括以前的纯客户端版），app 里会提示更新，点更新、重启就是这一版。\n第一次装：解压后把 dodoer.app 拖进「应用程序」，再在终端执行 `xattr -dr com.apple.quarantine /Applications/dodoer.app`（没有 Apple 开发者签名）。\n' \
            "$notes" "$TAG" "$NAME" "$ALIAS" "$CLIENT_ALIAS")
          # release-train.yml 按这个标记删老的自动版本。tag v$VERSION 建在编的这个提交上（手动 tag 也是，不再建在 main 上）：
          # 桌面 app「回退到上一版」之前，从上一版 tag 的源码读它认的数据库迁移（src-tauri/src/update/rollback.rs）
          target=$(git rev-parse HEAD)
          if [[ "$TRAIN" == true ]]; then body=$(printf '%s\n\n%s' "$body" "<!-- release-train -->"); fi
          files=("dist/$NAME.zip" "dist/$NAME.zip.sha256" "dist/$ALIAS" "dist/$ALIAS.sha256"
                 "dist/$CLIENT_ALIAS" "dist/$CLIENT_ALIAS.sha256"
                 "dist/$UPDATER" "dist/$UPDATER.sig" dist/latest.json dist/latest-client.json)
          if [[ -n "$X64_MANIFEST" ]]; then files+=("$X64_MANIFEST"); fi
          if gh release view "$rel" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$rel" -R "$RELEASE_REPO" --clobber "${files[@]}"
          else
            # --latest：本仓库也放 server 包的 Release，Latest 要明确给桌面版（app 从 releases/latest/download/ 查更新）
            create() { gh release create "$rel" -R "$RELEASE_REPO" --target "$1" --latest \
                         --title "dodoer ${VERSION}（${TAG}）" --notes "$body" "${files[@]}"; }
            # 自动发版的 tag release-train 的 plan 一开始就建在编的这个提交上，Release 挂到它上面，--target 不起作用；但 GitHub
            # 照样按 --target 查权限：编的时候 main 上合进了改 .github/workflows 的提交就 403。tag 已经指着这个提交，--target 直接给 main
            # （tag 不动、还在这个提交上），不用走下面 403 的路（2026-11-16 v1.6.35 就是走那条路发的）
            tagged=$(git ls-remote --tags origin | awk -v r="refs/tags/$rel" '$2 == r { p = $1 } $2 == r "^{}" { d = $1 } END { print (d ? d : p) }')
            api_target="$target"
            if [[ "$tagged" == "$target" ]]; then api_target=$(git ls-remote origin refs/heads/main | cut -f1); fi
            if ! create "$api_target" 2>"$RUNNER_TEMP/create.err"; then
              cat "$RUNNER_TEMP/create.err" >&2
              grep -q 'HTTP 403' "$RUNNER_TEMP/create.err" || exit 1
              # 403：编的时候 main 上又合了改 .github/workflows 的提交，GITHUB_TOKEN 不能把 tag 建在 workflow 跟 main 不一样的提交上。
              # 自动发版的 tag 一开始就占好了，不走这里；手动 tag（v1.Y.Z 要在这里新建）和重跑（占的 tag 已经删了）才会
              # 「回退到上一版」只从 tag 的源码读数据库迁移，迁移跟 main 一样的话 tag 建在 main 上读到的也一样；不一样就只能手动补发
              git fetch -q --depth=1 origin main
              main=$(git rev-parse FETCH_HEAD)
              dir=src-tauri/src/db/migration
              if [[ $(git rev-parse "$target:$dir") != $(git rev-parse "$main:$dir") ]]; then
                echo "::error::tag $rel 建不到编的这个提交（$target）上：编的时候 main 上又合了改 .github/workflows 的提交（GITHUB_TOKEN 不能把 tag 建在 workflow 跟 main 不一样的提交上）。$dir 跟 main（$main）不一样，不能改建在 main 上（「回退到上一版」从 tag 的源码读迁移）。手动补发：下载这次 run 的 artifact，用有 workflow 权限的令牌照这一步的命令 gh release create $rel --target $target --latest"
                exit 1
              fi
              echo "::warning::tag $rel 建不到编的这个提交（$target）上（编的时候 main 上又合了改 .github/workflows 的提交），改建在 main（$main）上：$dir 两边一样"
              create "$main"
            else
              cat "$RUNNER_TEMP/create.err" >&2
            fi
          fi
          echo "### dodoer $VERSION 已发布：https://github.com/$RELEASE_REPO/releases/tag/$rel" >> "$GITHUB_STEP_SUMMARY"
